<!doctype html>
<html lang="en-us">
  <head>
    <meta http-equiv="x-ua-compatible" content="IE=edge">
    <title>WineBOX - Gaming Edition</title>
    <!--[if IE]><style>#targetIE {margin-left:-2.5px;}</style><![endif]-->
    <link rel="stylesheet" href="lib/style.css"/>
    <link rel="stylesheet" type="text/css" href="wine.css">
    <link rel="stylesheet" href="lib/scrollbar.css"/>
    <link rel="shortcut icon" href="favicon.ico"/>

    <!-- Estilos del teclado virtual -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Contenedor de controles (gamepad) */
        .gamepad-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(20, 20, 40, 0.95);
            border-radius: 12px 12px 0 0;
            padding: 12px 15px 20px 15px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(100, 100, 255, 0.2);
            border-bottom: none;
            z-index: 9998;
            display: none;
            max-height: 240px;
            overflow: visible;
            width: 100%;
        }

        /* Contenedor del teclado virtual (original) */
        .virtual-keyboard-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 15, 35, 0.98);
            border-radius: 8px 8px 0 0;
            padding: 8px 8px 15px 8px;
            box-shadow: 0 -3px 15px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: none;
            z-index: 10000;
            display: none;
            max-height: 220px;
            overflow: visible;
            width: 100%;
        }

        /* Estructura del gamepad */
        .gamepad-layout {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 160px;
            padding: 0 10px;
        }

        /* Sección izquierda: D-Pad/WASD */
        .gamepad-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        /* Sección derecha: Botones de acción */
        .gamepad-right {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        /* Sección central: Botones especiales */
        .gamepad-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            flex: 1;
            height: 100%;
        }

        /* D-Pad estilo cruceta */
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
            width: 120px;
            height: 120px;
            margin-top: 10px;
        }

        .d-pad-btn {
            background: linear-gradient(135deg, #4a4a6a 0%, #353555 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 0 #2a2a3a, 
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.1s ease;
            user-select: none;
        }

        .d-pad-btn:hover {
            background: linear-gradient(135deg, #5a5a7a 0%, #454565 100%);
            transform: translateY(-1px);
        }

        .d-pad-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #2a2a3a;
        }

        /* Botones de acción (estilo Xbox/PlayStation) */
        .action-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3),
                        inset 0 2px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.1s ease;
            margin: 5px;
            position: relative;
        }

        .action-btn:before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.3), transparent);
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.3);
        }

        .action-btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
        }

        /* Colores específicos para botones */
        .btn-a {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff4757 100%);
            grid-area: 2 / 3 / 3 / 4;
        }

        .btn-b {
            background: linear-gradient(135deg, #ffa502 0%, #ff7f00 100%);
            grid-area: 1 / 2 / 2 / 3;
        }

        .btn-x {
            background: linear-gradient(135deg, #00d2d3 0%, #00a8a8 100%);
            grid-area: 2 / 1 / 3 / 2;
        }

        .btn-y {
            background: linear-gradient(135deg, #a29bfe 0%, #6c5ce7 100%);
            grid-area: 1 / 2 / 2 / 3;
        }

        /* Botones especiales */
        .special-btn {
            background: linear-gradient(135deg, #2d3436 0%, #636e72 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px 0;
            width: 140px;
            box-shadow: 0 3px 0 #1a1a1a;
            transition: all 0.1s ease;
            text-align: center;
        }

        .special-btn:hover {
            background: linear-gradient(135deg, #3d4446 0%, #737e82 100%);
            transform: translateY(-1px);
        }

        .special-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1a1a1a;
        }

        /* Botón Start (verde) */
        .btn-start {
            background: linear-gradient(135deg, #00b894 0%, #00a085 100%);
        }

        /* Botón Select/Back (azul) */
        .btn-select {
            background: linear-gradient(135deg, #0984e3 0%, #0770c4 100%);
        }

        /* Botón para abrir teclado */
        .btn-keyboard {
            background: linear-gradient(135deg, #a29bfe 0%, #6c5ce7 100%);
        }

        /* Botones de toggle */
        .control-toggle-buttons {
            position: fixed;
            bottom: 60px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 9999;
        }

        .toggle-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .toggle-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }

        /* Botón gamepad */
        .gamepad-toggle {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff4757 100%);
        }

        /* Botón teclado */
        .keyboard-toggle {
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
        }

        /* Encabezados */
        .gamepad-header, .keyboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            height: 30px;
        }

        .gamepad-title, .keyboard-title {
            color: #00ffcc;
            font-size: 14px;
            font-weight: bold;
        }

        .close-gamepad, .close-keyboard {
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 11px;
        }

        /* Estilos para cuando cualquier control está activo */
        .controls-active #canvas {
            margin-bottom: 250px;
            transition: margin-bottom 0.3s ease;
        }

        /* Estilos del teclado original (simplificados) */
        .keyboard {
            background: linear-gradient(135deg, #1e1e3f 0%, #2d2b55 100%);
            border-radius: 8px;
            padding: 10px;
            width: 100%;
            height: 165px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 3px;
            flex: 1;
        }

        .key {
            background: linear-gradient(135deg, #3c3c5a 0%, #2a2a4a 100%);
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 6px 0;
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 0 #1a1a35;
            user-select: none;
            flex: 1;
            min-height: 30px;
            transition: all 0.1s ease;
        }

        .key:hover {
            background: linear-gradient(135deg, #4c4c6a 0%, #3a3a5a 100%);
            transform: translateY(-1px);
        }

        .key:active {
            transform: translateY(1px);
            box-shadow: 0 1px 0 #1a1a35;
        }

        .key-space {
            background: linear-gradient(135deg, #96ceb4 0%, #7ab89c 100%);
            flex: 5;
            font-size: 13px;
            font-weight: bold;
            color: #2d3436;
            height: 40px;
        }

        .key-sub {
            font-size: 8px;
            opacity: 0.7;
            margin-top: 2px;
        }
    </style>
  </head>
  <body>

  <!-- Script para controles virtuales -->
  <script>
      // Sistema de gamepad virtual
      let activeControl = null;
      
      // Mapeo de teclas para el emulador
      const keyCodeMap = {
          'w': 87, 'a': 65, 's': 83, 'd': 68,
          ' ': 32, 'Control': 17, 'Shift': 16, 'Alt': 18,
          'Enter': 13, 'Escape': 27,
          'ArrowUp': 38, 'ArrowDown': 40, 'ArrowLeft': 37, 'ArrowRight': 39
      };

      // Configuraciones predefinidas para diferentes tipos de juegos
      const gameConfigs = {
          'default': {
              up: 'w', down: 's', left: 'a', right: 'd',
              action: ' ', jump: ' ', attack: 'Control',
              special: 'Shift', start: 'Enter', select: 'Escape'
          },
          'platformer': {
              up: 'w', down: 's', left: 'a', right: 'd',
              action: ' ', jump: ' ', attack: 'Control',
              special: 'Shift', start: 'Enter', select: 'Escape'
          },
          'rpg': {
              up: 'w', down: 's', left: 'a', right: 'd',
              action: 'Enter', jump: ' ', attack: 'Control',
              special: 'Shift', start: 'Enter', select: 'Escape'
          },
          'fps': {
              up: 'w', down: 's', left: 'a', right: 'd',
              action: ' ', jump: ' ', attack: 'Control',
              special: 'Shift', start: 'Enter', select: 'Escape'
          }
      };

      let currentConfig = 'default';

      // Función para enviar teclas al emulador
      function sendGamepadKey(key, isKeyDown = true) {
          const canvas = document.getElementById('canvas');
          if (!canvas) return;

          const keyCode = keyCodeMap[key] || key.charCodeAt(0);
          const eventType = isKeyDown ? 'keydown' : 'keyup';
          
          const event = new KeyboardEvent(eventType, {
              key: key,
              code: 'Key' + (key.length === 1 ? key.toUpperCase() : key),
              keyCode: keyCode,
              which: keyCode,
              bubbles: true,
              cancelable: true
          });
          
          canvas.dispatchEvent(event);
          console.log(`Gamepad: ${eventType} ${key} (${keyCode})`);
      }

      // Función para alternar gamepad
      function toggleGamepad() {
          const gamepad = document.getElementById('gamepad');
          const keyboard = document.getElementById('virtualKeyboard');
          
          if (gamepad.style.display === 'block') {
              gamepad.style.display = 'none';
              activeControl = null;
          } else {
              // Ocultar teclado si está visible
              keyboard.style.display = 'none';
              // Mostrar gamepad
              gamepad.style.display = 'block';
              activeControl = 'gamepad';
              document.body.classList.add('controls-active');
          }
          
          updateControlState();
      }

      // Función para alternar teclado
      function toggleVirtualKeyboard() {
          const keyboard = document.getElementById('virtualKeyboard');
          const gamepad = document.getElementById('gamepad');
          
          if (keyboard.style.display === 'block') {
              keyboard.style.display = 'none';
              activeControl = null;
          } else {
              // Ocultar gamepad si está visible
              gamepad.style.display = 'none';
              // Mostrar teclado
              keyboard.style.display = 'block';
              activeControl = 'keyboard';
              document.body.classList.add('controls-active');
          }
          
          updateControlState();
      }

      // Función para cambiar de gamepad a teclado
      function switchToKeyboard() {
          const gamepad = document.getElementById('gamepad');
          const keyboard = document.getElementById('virtualKeyboard');
          
          gamepad.style.display = 'none';
          keyboard.style.display = 'block';
          activeControl = 'keyboard';
          updateControlState();
      }

      // Actualizar estado de controles
      function updateControlState() {
          if (activeControl === 'gamepad' || activeControl === 'keyboard') {
              document.body.classList.add('controls-active');
          } else {
              document.body.classList.remove('controls-active');
          }
      }

      // Configurar botones del gamepad
      function setupGamepadButtons() {
          // D-Pad / WASD
          const dpadButtons = document.querySelectorAll('.d-pad-btn[data-key]');
          dpadButtons.forEach(btn => {
              const key = btn.getAttribute('data-key');
              
              btn.addEventListener('mousedown', () => {
                  btn.classList.add('active');
                  sendGamepadKey(key, true);
              });
              
              btn.addEventListener('mouseup', () => {
                  btn.classList.remove('active');
                  sendGamepadKey(key, false);
              });
              
              btn.addEventListener('mouseleave', () => {
                  if (btn.classList.contains('active')) {
                      btn.classList.remove('active');
                      sendGamepadKey(key, false);
                  }
              });
              
              // Touch support
              btn.addEventListener('touchstart', (e) => {
                  e.preventDefault();
                  btn.classList.add('active');
                  sendGamepadKey(key, true);
              });
              
              btn.addEventListener('touchend', (e) => {
                  e.preventDefault();
                  btn.classList.remove('active');
                  sendGamepadKey(key, false);
              });
          });

          // Botones de acción (A, B, X, Y)
          const actionButtons = document.querySelectorAll('.action-btn[data-key]');
          actionButtons.forEach(btn => {
              const key = btn.getAttribute('data-key');
              
              btn.addEventListener('mousedown', () => {
                  sendGamepadKey(key, true);
              });
              
              btn.addEventListener('mouseup', () => {
                  sendGamepadKey(key, false);
              });
              
              btn.addEventListener('mouseleave', () => {
                  sendGamepadKey(key, false);
              });
              
              // Touch support
              btn.addEventListener('touchstart', (e) => {
                  e.preventDefault();
                  sendGamepadKey(key, true);
              });
              
              btn.addEventListener('touchend', (e) => {
                  e.preventDefault();
                  sendGamepadKey(key, false);
              });
          });

          // Botones especiales (Start, Select, Teclado)
          const specialButtons = document.querySelectorAll('.special-btn[data-key]');
          specialButtons.forEach(btn => {
              const key = btn.getAttribute('data-key');
              
              btn.addEventListener('click', () => {
                  // Para botones de acción momentánea
                  sendGamepadKey(key, true);
                  setTimeout(() => sendGamepadKey(key, false), 100);
              });
          });
      }

      // Sistema de teclado virtual (original, actualizado)
      let isShiftActive = false;
      let isCapsActive = false;
      
      const shiftMap = {
          '`': '~', '1': '!', '2': '@', '3': '#', '4': '$', '5': '%', 
          '6': '^', '7': '&', '8': '*', '9': '(', '0': ')', '-': '_', 
          '=': '+', '[': '{', ']': '}', '\\': '|', ';': ':', "'": '"', 
          ',': '<', '.': '>', '/': '?',
          'a': 'A', 'b': 'B', 'c': 'C', 'd': 'D', 'e': 'E', 'f': 'F',
          'g': 'G', 'h': 'H', 'i': 'I', 'j': 'J', 'k': 'K', 'l': 'L',
          'm': 'M', 'n': 'N', 'o': 'O', 'p': 'P', 'q': 'Q', 'r': 'R',
          's': 'S', 't': 'T', 'u': 'U', 'v': 'V', 'w': 'W', 'x': 'X',
          'y': 'Y', 'z': 'Z'
      };

      function sendKeyToEmulator(key, isSpecialKey = false) {
          const canvas = document.getElementById('canvas');
          if (!canvas) return;

          let keyCode;
          let keyValue = key;

          if (isSpecialKey) {
              keyCode = keyCodeMap[key] || 0;
          } else {
              if (isShiftActive && shiftMap[key]) {
                  keyValue = shiftMap[key];
              } else if (isCapsActive && key.match(/[a-z]/)) {
                  keyValue = key.toUpperCase();
              }
              keyCode = keyCodeMap[key] || keyValue.charCodeAt(0);
          }

          // Evento keydown
          const keyDownEvent = new KeyboardEvent('keydown', {
              key: keyValue,
              code: 'Key' + (key.length === 1 ? key.toUpperCase() : key),
              keyCode: keyCode,
              which: keyCode,
              bubbles: true,
              cancelable: true
          });

          // Evento keypress para caracteres
          if (!isSpecialKey && key.length === 1) {
              const keyPressEvent = new KeyboardEvent('keypress', {
                  key: keyValue,
                  code: 'Key' + key.toUpperCase(),
                  keyCode: keyValue.charCodeAt(0),
                  charCode: keyValue.charCodeAt(0),
                  which: keyValue.charCodeAt(0),
                  bubbles: true,
                  cancelable: true
              });
              
              canvas.dispatchEvent(keyPressEvent);
          }

          canvas.dispatchEvent(keyDownEvent);

          // Evento keyup
          setTimeout(() => {
              const keyUpEvent = new KeyboardEvent('keyup', {
                  key: keyValue,
                  code: 'Key' + (key.length === 1 ? key.toUpperCase() : key),
                  keyCode: keyCode,
                  which: keyCode,
                  bubbles: true,
                  cancelable: true
              });
              canvas.dispatchEvent(keyUpEvent);
          }, 50);

          // Feedback en consola
          const output = document.getElementById('output');
          if (output && output.style.display !== 'none') {
              if (key === 'Backspace') {
                  output.value = output.value.slice(0, -1);
              } else if (key === 'Enter') {
                  output.value += '\n';
              } else if (key === 'Tab') {
                  output.value += '    ';
              } else if (!isSpecialKey || key === ' ') {
                  output.value += keyValue;
              }
              output.scrollTop = output.scrollHeight;
          }
      }

      function setupKeyboard() {
          const keys = document.querySelectorAll('.key');
          
          keys.forEach(key => {
              key.addEventListener('click', function() {
                  const keyValue = this.getAttribute('data-key');
                  
                  if (this.classList.contains('key-special') || 
                      this.classList.contains('key-utility')) {
                      handleSpecialKey(keyValue);
                  } else {
                      sendKeyToEmulator(keyValue, false);
                      
                      if (isShiftActive && keyValue !== 'Shift') {
                          toggleShift();
                      }
                  }
              });
          });

          // Enfocar canvas
          const canvas = document.getElementById('canvas');
          if (canvas) {
              canvas.setAttribute('tabindex', '0');
              canvas.focus();
              
              document.addEventListener('click', function() {
                  canvas.focus();
              });
          }
      }

      function handleSpecialKey(key) {
          switch(key) {
              case 'Backspace':
                  sendKeyToEmulator('Backspace', true);
                  break;
              case 'Enter':
                  sendKeyToEmulator('Enter', true);
                  break;
              case 'Tab':
                  sendKeyToEmulator('Tab', true);
                  break;
              case ' ':
                  sendKeyToEmulator(' ', false);
                  break;
              case 'Shift':
                  toggleShift();
                  break;
              case 'CapsLock':
                  toggleCaps();
                  break;
              case 'Control':
                  sendKeyToEmulator('Control', true);
                  break;
              case 'Alt':
                  sendKeyToEmulator('Alt', true);
                  break;
          }
      }

      function toggleShift() {
          isShiftActive = !isShiftActive;
          const shiftKey = document.getElementById('shiftKey');
          const shiftKeyRight = document.getElementById('shiftKeyRight');
          
          if (shiftKey) shiftKey.classList.toggle('key-shift-active', isShiftActive);
          if (shiftKeyRight) shiftKeyRight.classList.toggle('key-shift-active', isShiftActive);
      }

      function toggleCaps() {
          isCapsActive = !isCapsActive;
          const capsLock = document.getElementById('capsLock');
          if (capsLock) capsLock.classList.toggle('key-caps-active', isCapsActive);
      }

      // Inicialización
      document.addEventListener('DOMContentLoaded', function() {
          setupGamepadButtons();
          setupKeyboard();
          
          console.log('🎮 Gamepad virtual cargado');
          console.log('⌨️ Teclado virtual cargado');
          
          // Configurar por defecto
          applyGameConfig('default');
      });

      // Aplicar configuración de juego
      function applyGameConfig(configName) {
          if (gameConfigs[configName]) {
              currentConfig = configName;
              console.log(`Configuración aplicada: ${configName}`);
          }
      }

      // API global
      window.virtualControls = {
          showGamepad: function() {
              toggleGamepad();
          },
          showKeyboard: function() {
              toggleVirtualKeyboard();
          },
          hideAll: function() {
              document.getElementById('gamepad').style.display = 'none';
              document.getElementById('virtualKeyboard').style.display = 'none';
              activeControl = null;
              document.body.classList.remove('controls-active');
          },
          setGameConfig: applyGameConfig,
          getCurrentConfig: function() {
              return currentConfig;
          }
      };

      // Integración con sistema original
      function toggleConsoleAndKeyboard() {
          const consoleEl = document.getElementById('output');
          const showConsole = document.getElementById('showConsole');
          
          if (showConsole.checked) {
              consoleEl.style.display = '';
              // Mostrar teclado cuando se muestra la consola
              toggleVirtualKeyboard();
          } else {
              consoleEl.style.display = 'none';
              // Ocultar controles cuando se oculta la consola
              window.virtualControls.hideAll();
          }
      }

      // Sobrescribir función original
      const originalToggleConsole = window.toggleConsole;
      window.toggleConsole = function() {
          toggleConsoleAndKeyboard();
      };
  </script>

  <script>
  function startInline() {
      document.getElementById('run-inline').style.display = 'none';
      document.getElementById('loading').style.display = '';
      Config.isRunningInline = true;
      Config.urlParams = "p=dock";
      var script = document.createElement('script');
      script.src = "kernel.js";
      document.body.appendChild(script);
  }
  function addDefaultOnDemand(params) {
      if(! params.includes("root=") &&  ! params.includes("ondemand=")) {
          if(params.length >0) {
              params = params + "&";
          }
          params = params + "ondemand=root&root=dlls&inline-default-ondemand-root-overlay=dlls";
      }
      return params;
  }
  </script>
  <script async type="text/javascript" src="kernel.js"></script>
