    <!-- Estilos del teclado virtual - VERSIÓN CON BARRA ESPACIADORA COMPLETA -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .virtual-keyboard-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 15, 35, 0.98);
            border-radius: 8px 8px 0 0;
            padding: 8px 8px 15px 8px; /* Más padding abajo para espacio */
            box-shadow: 0 -3px 15px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: none;
            z-index: 10000;
            display: none;
            max-height: 220px; /* Aumentado */
            overflow: visible; /* Visible para que no corte */
            width: 100%;
        }

        .keyboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            height: 25px; /* Altura fija */
        }

        .keyboard-title {
            color: #00ffcc;
            font-size: 12px;
            font-weight: bold;
        }

        .close-keyboard {
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 10px;
        }

        .keyboard {
            background: linear-gradient(135deg, #1e1e3f 0%, #2d2b55 100%);
            border-radius: 8px;
            padding: 8px 10px 12px 10px; /* Más padding abajo */
            width: 100%;
            height: 165px; /* Altura ajustada */
            display: flex;
            flex-direction: column;
            gap: 3px; /* Espacio entre filas */
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            width: 100%;
            flex: 1;
            gap: 2px;
        }

        /* Última fila más alta para barra espaciadora */
        .keyboard-row:last-child {
            flex: 1.3; /* Más alta */
            margin-top: 2px;
        }

        .key {
            background: linear-gradient(135deg, #3c3c5a 0%, #2a2a4a 100%);
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 4px 0;
            cursor: pointer;
            transition: all 0.1s ease;
            font-weight: 600;
            font-size: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 2px 0 #1a1a35,
                0 3px 5px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            user-select: none;
            flex: 1;
            min-height: 28px; /* Altura mínima */
            height: 100%; /* Ocupa toda la altura de la fila */
        }

        .key:hover {
            background: linear-gradient(135deg, #4c4c6a 0%, #3a3a5a 100%);
            transform: translateY(-1px);
        }

        .key:active {
            transform: translateY(1px);
            box-shadow: 
                0 1px 0 #1a1a35,
                0 2px 3px rgba(0, 0, 0, 0.2);
        }

        .key-wide {
            flex: 1.5;
        }

        .key-extra-wide {
            flex: 2;
        }

        .key-ultra-wide {
            flex: 4;
        }

        .key-special {
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
        }

        .key-utility {
            background: linear-gradient(135deg, #45b7d1 0%, #3a92ab 100%);
        }

        /* BARRA ESPACIADORA - COMPLETAMENTE VISIBLE */
        .key-space {
            background: linear-gradient(135deg, #96ceb4 0%, #7ab89c 100%);
            flex: 5 !important;
            height: 38px !important; /* Altura fija mayor */
            min-height: 38px !important;
            font-size: 13px !important;
            font-weight: bold;
            color: #2d3436;
            box-shadow: 
                0 3px 0 #5a8c7a,
                0 5px 10px rgba(0, 0, 0, 0.3),
                inset 0 2px 0 rgba(255, 255, 255, 0.3);
            margin: 0 5px;
            align-self: center; /* Centrada verticalmente */
            position: relative;
            top: 0; /* Aseguramos que no esté cortada */
        }

        .key-space:hover {
            background: linear-gradient(135deg, #a8e0c8 0%, #8cc8ac 100%);
        }

        .key-space:active {
            transform: translateY(2px);
            box-shadow: 
                0 1px 0 #5a8c7a,
                0 3px 5px rgba(0, 0, 0, 0.2);
        }

        .key-sub {
            font-size: 7px;
            opacity: 0.7;
            margin-top: 1px;
        }

        .key-shift-active {
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            color: #2d3436;
        }

        .key-caps-active {
            background: linear-gradient(135deg, #a29bfe 0%, #6c5ce7 100%);
            color: white;
        }

        /* Estilos para cuando el teclado está activo */
        .keyboard-active #canvas {
            margin-bottom: 200px; /* Aumentado para el teclado más alto */
            transition: margin-bottom 0.3s ease;
        }

        .keyboard-toggle {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: #4ecdc4;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            z-index: 9999;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        /* Ajustes para teclas específicas */
        #capsLock, #shiftKey, #shiftKeyRight {
            font-size: 9px;
        }
    </style>
  </head>

        <!-- Script del teclado virtual -->
        <script>
            let isShiftActive = false;
            let isCapsActive = false;
            
            // Mapeo de teclas para el modo shift
            const shiftMap = {
                '`': '~', '1': '!', '2': '@', '3': '#', '4': '$', '5': '%', 
                '6': '^', '7': '&', '8': '*', '9': '(', '0': ')', '-': '_', 
                '=': '+', '[': '{', ']': '}', '\\': '|', ';': ':', "'": '"', 
                ',': '<', '.': '>', '/': '?',
                'a': 'A', 'b': 'B', 'c': 'C', 'd': 'D', 'e': 'E', 'f': 'F',
                'g': 'G', 'h': 'H', 'i': 'I', 'j': 'J', 'k': 'K', 'l': 'L',
                'm': 'M', 'n': 'N', 'o': 'O', 'p': 'P', 'q': 'Q', 'r': 'R',
                's': 'S', 't': 'T', 'u': 'U', 'v': 'V', 'w': 'W', 'x': 'X',
                'y': 'Y', 'z': 'Z'
            };

            // Mapeo de keyCodes para eventos de teclado
            const keyCodeMap = {
                '`': 192, '1': 49, '2': 50, '3': 51, '4': 52, '5': 53,
                '6': 54, '7': 55, '8': 56, '9': 57, '0': 48, '-': 173,
                '=': 61, '[': 219, ']': 221, '\\': 220, ';': 186, "'": 222,
                ',': 188, '.': 190, '/': 191, ' ': 32,
                'a': 65, 'b': 66, 'c': 67, 'd': 68, 'e': 69, 'f': 70,
                'g': 71, 'h': 72, 'i': 73, 'j': 74, 'k': 75, 'l': 76,
                'm': 77, 'n': 78, 'o': 79, 'p': 80, 'q': 81, 'r': 82,
                's': 83, 't': 84, 'u': 85, 'v': 86, 'w': 87, 'x': 88,
                'y': 89, 'z': 90
            };

            // Mapeo de teclas especiales
            const specialKeyCodes = {
                'Backspace': 8,
                'Tab': 9,
                'Enter': 13,
                'Shift': 16,
                'Control': 17,
                'Alt': 18,
                'CapsLock': 20,
                'Escape': 27
            };

            function toggleVirtualKeyboard() {
                const keyboard = document.getElementById('virtualKeyboard');
                const isVisible = keyboard.style.display === 'block';
                
                if (isVisible) {
                    keyboard.style.display = 'none';
                    document.body.classList.remove('keyboard-active');
                } else {
                    keyboard.style.display = 'block';
                    document.body.classList.add('keyboard-active');
                    // Asegurar que el teclado esté pegado al fondo (y=0)
                    keyboard.style.bottom = '0';
                    // Forzar reflow para asegurar visibilidad
                    setTimeout(() => {
                        const spaceKey = document.querySelector('.key-space');
                        if (spaceKey) {
                            spaceKey.style.visibility = 'visible';
                            console.log('Barra espaciadora visible y posicionada');
                        }
                    }, 10);
                }
            }

            function toggleConsoleAndKeyboard() {
                const consoleEl = document.getElementById('output');
                const showConsole = document.getElementById('showConsole');
                
                if (showConsole.checked) {
                    consoleEl.style.display = '';
                    // Mostrar teclado cuando se muestra la consola
                    const keyboard = document.getElementById('virtualKeyboard');
                    keyboard.style.display = 'block';
                    keyboard.style.bottom = '0'; // Pegado al fondo
                    document.body.classList.add('keyboard-active');
                } else {
                    consoleEl.style.display = 'none';
                    // Ocultar teclado cuando se oculta la consola
                    document.getElementById('virtualKeyboard').style.display = 'none';
                    document.body.classList.remove('keyboard-active');
                }
            }

            function sendKeyToEmulator(key, isSpecialKey = false) {
                const canvas = document.getElementById('canvas');
                if (!canvas) return;

                let keyCode;
                let keyValue = key;

                // Determinar el keyCode
                if (isSpecialKey) {
                    keyCode = specialKeyCodes[key] || 0;
                } else {
                    // Aplicar transformaciones de shift/caps
                    if (isShiftActive && shiftMap[key]) {
                        keyValue = shiftMap[key];
                    } else if (isCapsActive && key.match(/[a-z]/)) {
                        keyValue = key.toUpperCase();
                    }
                    keyCode = keyCodeMap[key] || keyValue.charCodeAt(0);
                }

                // Crear y disparar evento keydown
                const keyDownEvent = new KeyboardEvent('keydown', {
                    key: keyValue,
                    code: 'Key' + (key.length === 1 ? key.toUpperCase() : key),
                    keyCode: keyCode,
                    which: keyCode,
                    bubbles: true,
                    cancelable: true
                });

                // Crear y disparar evento keypress (para caracteres)
                if (!isSpecialKey && key.length === 1) {
                    const keyPressEvent = new KeyboardEvent('keypress', {
                        key: keyValue,
                        code: 'Key' + key.toUpperCase(),
                        keyCode: keyValue.charCodeAt(0),
                        charCode: keyValue.charCodeAt(0),
                        which: keyValue.charCodeAt(0),
                        bubbles: true,
                        cancelable: true
                    });
                    
                    canvas.dispatchEvent(keyPressEvent);
                }

                // Disparar keydown
                canvas.dispatchEvent(keyDownEvent);

                // Crear y disparar evento keyup después de un breve delay
                setTimeout(() => {
                    const keyUpEvent = new KeyboardEvent('keyup', {
                        key: keyValue,
                        code: 'Key' + (key.length === 1 ? key.toUpperCase() : key),
                        keyCode: keyCode,
                        which: keyCode,
                        bubbles: true,
                        cancelable: true
                    });
                    canvas.dispatchEvent(keyUpEvent);
                }, 50);

                // También escribir en la consola de debug para feedback
                const output = document.getElementById('output');
                if (output && output.style.display !== 'none') {
                    if (key === 'Backspace') {
                        output.value = output.value.slice(0, -1);
                    } else if (key === 'Enter') {
                        output.value += '\n';
                    } else if (key === 'Tab') {
                        output.value += '    ';
                    } else if (!isSpecialKey || key === ' ') {
                        output.value += keyValue;
                    }
                    output.scrollTop = output.scrollHeight;
                }

                console.log(`Tecla enviada al emulador: ${keyValue} (keyCode: ${keyCode})`);
            }

            function handleSpecialKey(key) {
                switch(key) {
                    case 'Backspace':
                        sendKeyToEmulator('Backspace', true);
                        break;
                    case 'Enter':
                        sendKeyToEmulator('Enter', true);
                        break;
                    case 'Tab':
                        sendKeyToEmulator('Tab', true);
                        break;
                    case ' ':
                        sendKeyToEmulator(' ', false); // Barra espaciadora como tecla normal
                        console.log('Barra espaciadora presionada');
                        break;
                    case 'Shift':
                        toggleShift();
                        break;
                    case 'CapsLock':
                        toggleCaps();
                        break;
                    case 'Control':
                        sendKeyToEmulator('Control', true);
                        break;
                    case 'Alt':
                        sendKeyToEmulator('Alt', true);
                        break;
                }
            }

            function toggleShift() {
                isShiftActive = !isShiftActive;
                const shiftKey = document.getElementById('shiftKey');
                const shiftKeyRight = document.getElementById('shiftKeyRight');
                
                if (shiftKey) shiftKey.classList.toggle('key-shift-active', isShiftActive);
                if (shiftKeyRight) shiftKeyRight.classList.toggle('key-shift-active', isShiftActive);
            }

            function toggleCaps() {
                isCapsActive = !isCapsActive;
                const capsLock = document.getElementById('capsLock');
                if (capsLock) capsLock.classList.toggle('key-caps-active', isCapsActive);
            }

            // Inicializar event listeners para las teclas
            document.addEventListener('DOMContentLoaded', function() {
                const keys = document.querySelectorAll('.key');
                
                keys.forEach(key => {
                    key.addEventListener('click', function() {
                        const keyValue = this.getAttribute('data-key');
                        
                        // Si es una tecla especial
                        if (this.classList.contains('key-special') || 
                            this.classList.contains('key-utility')) {
                            handleSpecialKey(keyValue);
                        } 
                        // Si es una tecla normal
                        else {
                            sendKeyToEmulator(keyValue, false);
                            
                            // Desactivar shift después de una tecla normal
                            if (isShiftActive && keyValue !== 'Shift') {
                                toggleShift();
                            }
                        }
                    });
                });

                // Asegurarse de que el canvas pueda recibir eventos de teclado
                const canvas = document.getElementById('canvas');
                if (canvas) {
                    canvas.setAttribute('tabindex', '0');
                    canvas.focus();
                    
                    // Re-enfocar el canvas cuando se hace clic en cualquier lugar
                    document.addEventListener('click', function() {
                        canvas.focus();
                    });
                }
                
                // Verificar que la barra espaciadora esté presente y visible
                setTimeout(() => {
                    const spaceKey = document.querySelector('.key-space');
                    if (spaceKey) {
                        console.log('✅ Barra espaciadora cargada correctamente');
                        console.log('Dimensiones:', spaceKey.offsetWidth, 'x', spaceKey.offsetHeight);
                        console.log('Posición:', spaceKey.getBoundingClientRect());
                        
                        // Asegurar visibilidad máxima
                        spaceKey.style.opacity = '1';
                        spaceKey.style.visibility = 'visible';
                        spaceKey.style.zIndex = '10001';
                        spaceKey.style.position = 'relative';
                        
                        // Resaltar temporalmente para verificación
                        spaceKey.style.boxShadow = '0 0 10px #00ff00, 0 3px 0 #5a8c7a';
                    } else {
                        console.error('❌ Barra espaciadora NO encontrada en el DOM');
                    }
                }, 100);
            });

            // Sobrescribir la función toggleConsole original
            const originalToggleConsole = window.toggleConsole;
            window.toggleConsole = function() {
                toggleConsoleAndKeyboard();
            };

            // Función global para que otros scripts puedan usar el teclado
            window.virtualKeyboard = {
                show: function() {
                    const keyboard = document.getElementById('virtualKeyboard');
                    keyboard.style.display = 'block';
                    keyboard.style.bottom = '0'; // Pegado al fondo
                    document.body.classList.add('keyboard-active');
                },
                hide: function() {
                    document.getElementById('virtualKeyboard').style.display = 'none';
                    document.body.classList.remove('keyboard-active');
                },
                toggle: toggleVirtualKeyboard,
                sendKey: sendKeyToEmulator
            };
        </script>

        <script>
        function startInline() {
            document.getElementById('run-inline').style.display = 'none';
            document.getElementById('loading').style.display = '';
            Config.isRunningInline = true;
            Config.urlParams = "p=dock";
            var script = document.createElement('script');
            script.src = "kernel.js";
            document.body.appendChild(script);
        }
        function addDefaultOnDemand(params) {
        	if(! params.includes("root=") &&  ! params.includes("ondemand=")) {
        		if(params.length >0) {
        			params = params + "&";
        		}
        		params = params + "ondemand=root&root=dlls&inline-default-ondemand-root-overlay=dlls";
        	}
        	return params;
        }
        </script>
        <script async type="text/javascript" src="kernel.js"></script>

  </body>
