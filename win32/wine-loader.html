<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WineBOX - Game Loader</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0a; 
            color: #fff; 
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
        }
        #loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loader-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #1a1a2e;
            border-top: 4px solid #6c5ce7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-text {
            margin-top: 20px;
            font-size: 18px;
            color: #888;
            letter-spacing: 2px;
        }
        .loader-progress {
            margin-top: 15px;
            width: 300px;
            height: 4px;
            background: #1a1a2e;
            border-radius: 2px;
            overflow: hidden;
        }
        .loader-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6c5ce7, #a29bfe);
            border-radius: 2px;
            transition: width 0.3s;
        }
        .loader-game-name {
            margin-top: 10px;
            font-size: 14px;
            color: #6c5ce7;
        }
        .loader-status {
            margin-top: 8px;
            font-size: 12px;
            color: #555;
        }
        #game-frame {
            width: 100vw;
            height: 100vh;
            border: none;
            display: none;
        }
        .error-message {
            color: #ff6b6b;
            text-align: center;
            padding: 20px;
            max-width: 500px;
        }
        .error-message h2 { margin-bottom: 10px; }
        .error-message button {
            margin-top: 20px;
            padding: 10px 30px;
            background: #6c5ce7;
            border: none;
            border-radius: 25px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }
        .error-message button:hover {
            background: #5a4bd1;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="loader-spinner"></div>
        <div class="loader-text">CARGANDO JUEGO</div>
        <div class="loader-progress"><div class="loader-progress-bar" id="progressBar"></div></div>
        <div class="loader-game-name" id="gameName">Preparando...</div>
        <div class="loader-status" id="loadStatus">Iniciando...</div>
    </div>
    <iframe id="game-frame" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals allow-downloads"></iframe>

    <script>
        // ========== CONFIGURACIÓN ==========
        const CONFIG = {
            wineBaseUrl: window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1),
            maxLoadTime: 60000,
            maxRetries: 3
        };

        // ========== OBTENER PARÁMETROS ==========
        function getParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name) || '';
        }

        // ========== ESTADO ==========
        let currentApp = {
            name: getParam('app') || 'Desconocido',
            exe: getParam('exe') || getParam('p') || '',
            zipUrl: getParam('zip') || getParam('url') || '',
            directUrl: getParam('direct') || ''
        };

        // Si no hay nombre, intentar obtenerlo de la URL
        if (!currentApp.name && window.location.pathname) {
            const pathParts = window.location.pathname.split('/');
            const lastPart = pathParts[pathParts.length - 1];
            if (lastPart && lastPart !== 'wine-loader.html') {
                currentApp.name = lastPart.replace('.html', '');
            }
        }

        // ========== ELEMENTOS DOM ==========
        const loadingScreen = document.getElementById('loading-screen');
        const gameFrame = document.getElementById('game-frame');
        const progressBar = document.getElementById('progressBar');
        const gameNameEl = document.getElementById('gameName');
        const loadStatusEl = document.getElementById('loadStatus');

        // ========== ACTUALIZAR PROGRESO ==========
        function updateProgress(value, text, status) {
            progressBar.style.width = Math.min(value, 100) + '%';
            if (text) gameNameEl.textContent = text;
            if (status) loadStatusEl.textContent = status;
        }

        // ========== MOSTRAR ERROR ==========
        function showError(message) {
            loadingScreen.innerHTML = `
                <div class="error-message">
                    <h2>⚠️ Error al cargar el juego</h2>
                    <p>${message}</p>
                    <button onclick="window.location.reload()">Reintentar</button>
                    <br><br>
                    <button onclick="window.close()">Cerrar</button>
                </div>
            `;
            loadingScreen.classList.remove('hidden');
        }

        // ========== DESCARGAR ZIP REMOTO ==========
        function downloadRemoteZip(url, callback) {
            updateProgress(30, currentApp.name, 'Descargando juego...');
            
            const xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.responseType = 'arraybuffer';
            
            xhr.onprogress = function(event) {
                if (event.lengthComputable) {
                    const percent = 30 + (event.loaded / event.total) * 40;
                    updateProgress(percent, currentApp.name, `Descargando... ${Math.round(percent)}%`);
                }
            };
            
            xhr.onload = function() {
                if (xhr.status === 200 || xhr.status === 0) {
                    updateProgress(70, currentApp.name, 'Juego descargado, preparando...');
                    callback(null, xhr.response);
                } else {
                    callback(new Error(`HTTP ${xhr.status}: ${xhr.statusText}`));
                }
            };
            
            xhr.onerror = function() {
                callback(new Error('Error de red al descargar el juego'));
            };
            
            xhr.ontimeout = function() {
                callback(new Error('Timeout al descargar el juego'));
            };
            
            xhr.timeout = CONFIG.maxLoadTime;
            xhr.send();
        }

        // ========== CARGAR JUEGO ==========
        function loadGame() {
            updateProgress(10, currentApp.name, 'Iniciando...');

            // Si es una URL directa a wine.html, usarla tal cual
            if (currentApp.directUrl && currentApp.directUrl.includes('wine.html')) {
                updateProgress(100, currentApp.name, 'Cargando...');
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                    gameFrame.style.display = 'block';
                    gameFrame.src = currentApp.directUrl;
                }, 300);
                return;
            }

            // Si hay un ZIP remoto, descargarlo y convertirlo a base64
            if (currentApp.zipUrl && currentApp.zipUrl.startsWith('http')) {
                downloadRemoteZip(currentApp.zipUrl, function(err, data) {
                    if (err) {
                        showError(`No se pudo descargar el juego: ${err.message}`);
                        return;
                    }
                    
                    try {
                        // Convertir a base64
                        const bytes = new Uint8Array(data);
                        let binary = '';
                        for (let i = 0; i < bytes.length; i++) {
                            binary += String.fromCharCode(bytes[i]);
                        }
                        const base64 = btoa(binary);
                        
                        updateProgress(90, currentApp.name, 'Preparando emulador...');
                        
                        // Construir URL para wine.html con el ZIP en base64
                        const wineUrl = `${CONFIG.wineBaseUrl}wine.html?app=${currentApp.name}&p=${currentApp.exe}&inline-default-ondemand-root-overlay=data:application/zip;base64,${encodeURIComponent(base64)}`;
                        
                        // Cargar en el iframe
                        gameFrame.src = wineUrl;
                        gameFrame.onload = function() {
                            updateProgress(100, currentApp.name, '¡Listo!');
                            setTimeout(() => {
                                loadingScreen.classList.add('hidden');
                                gameFrame.style.display = 'block';
                                try {
                                    gameFrame.contentWindow.focus();
                                } catch(e) {}
                            }, 300);
                        };
                        
                        gameFrame.onerror = function() {
                            showError('Error al cargar el emulador');
                        };
                        
                    } catch(e) {
                        showError(`Error al procesar el juego: ${e.message}`);
                    }
                });
                return;
            }

            // Si no hay ZIP, intentar cargar localmente
            const localUrl = `${CONFIG.wineBaseUrl}wine.html?app=${currentApp.name}&p=${currentApp.exe}`;
            updateProgress(100, currentApp.name, 'Cargando localmente...');
            setTimeout(() => {
                loadingScreen.classList.add('hidden');
                gameFrame.style.display = 'block';
                gameFrame.src = localUrl;
                try {
                    gameFrame.contentWindow.focus();
                } catch(e) {}
            }, 300);
        }

        // ========== INICIALIZAR ==========
        function init() {
            gameNameEl.textContent = `🎮 ${currentApp.name}`;
            loadStatusEl.textContent = 'Preparando...';
            
            // Verificar si es un juego de la base de datos local
            if (window.gameDatabase && window.gameDatabase[currentApp.name]) {
                const localGame = window.gameDatabase[currentApp.name];
                currentApp.zipUrl = localGame.link || currentApp.zipUrl;
                currentApp.exe = localGame.exe || currentApp.exe;
                currentApp.directUrl = localGame.directUrl || '';
                
                // Si el link es de archive.org, usarlo como ZIP
                if (localGame.link && localGame.link.includes('archive.org')) {
                    currentApp.zipUrl = localGame.link;
                }
            }

            // Si no hay URL y no hay nombre, error
            if (!currentApp.name || currentApp.name === 'Desconocido') {
                showError('No se especificó ningún juego para cargar.');
                return;
            }

            // Iniciar carga
            setTimeout(loadGame, 500);
        }

        // ========== EXPONER API ==========
        window.WineLoader = {
            loadGame: function(gameData) {
                currentApp = {
                    name: gameData.name || currentApp.name,
                    exe: gameData.exe || gameData.name + '.exe',
                    zipUrl: gameData.link || '',
                    directUrl: gameData.directUrl || ''
                };
                gameNameEl.textContent = `🎮 ${currentApp.name}`;
                loadStatusEl.textContent = 'Reiniciando...';
                setTimeout(loadGame, 300);
            },
            getStatus: function() {
                return {
                    loaded: loadingScreen.classList.contains('hidden'),
                    currentApp: currentApp
                };
            }
        };

        // ========== INICIAR ==========
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        console.log('🎮 Wine Loader v2.1');
        console.log(`📦 Cargando: ${currentApp.name}`);
        console.log(`🔗 ZIP: ${currentApp.zipUrl || 'local'}`);
        console.log(`📄 EXE: ${currentApp.exe}`);
    </script>
</body>
</html>
