<!doctype html>
<html lang="en-us">
  <head>
    <meta http-equiv="x-ua-compatible" content="IE=edge">
    <title>WineBOX - Gaming Edition</title>
    <!--[if IE]><style>#targetIE {margin-left:-2.5px;}</style><![endif]-->
    <link rel="stylesheet" href="lib/style.css"/>
    <link rel="stylesheet" type="text/css" href="wine.css">
    <link rel="stylesheet" href="lib/scrollbar.css"/>
    <link rel="shortcut icon" href="favicon.ico"/>
    <script src="lib/jquery-1.8.0.min.js" type="text/javascript"></script>
    <script src="lib/jquery-ui-1.8.23.min.js" type="text/javascript"></script>

    <!-- Estilos del sistema de controles mejorado -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* BOTÓN ÚNICO DE CONTROLES */
        .control-toggle-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            z-index: 9999;
            backdrop-filter: blur(10px);
            background: rgba(108, 92, 231, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .control-toggle-button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            background: rgba(108, 92, 231, 0.95);
        }

        .control-toggle-button:active {
            transform: scale(0.95);
        }

        /* JOYSTICK AL ESTILO XBOX CLOUD */
        .joystick-container {
            position: fixed;
            bottom: 100px;
            left: 30px;
            z-index: 9998;
            display: none;
            user-select: none;
            touch-action: none;
        }

        .joystick-base {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(30, 30, 30, 0.7);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .joystick-thumb {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 
                0 4px 15px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            cursor: move;
            transition: background 0.2s ease;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .joystick-thumb:active {
            background: rgba(255, 255, 255, 1);
            box-shadow: 
                0 6px 20px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .joystick-direction {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            pointer-events: none;
        }

        .joystick-center {
            position: absolute;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* BOTONES DE ACCIÓN TRANSPARENTES */
        .action-buttons-container {
            position: fixed;
            bottom: 100px;
            right: 30px;
            z-index: 9998;
            display: none;
            gap: 20px;
            flex-direction: column;
            align-items: center;
        }

        .action-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 107, 107, 0.7);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 
                0 6px 20px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
            user-select: none;
            touch-action: none;
        }

        .action-button:hover {
            transform: scale(1.05);
            background: rgba(255, 107, 107, 0.85);
        }

        .action-button:active {
            transform: scale(0.95);
            background: rgba(255, 107, 107, 1);
        }

        .action-button-b {
            background: rgba(0, 184, 148, 0.7);
        }

        .action-button-b:hover {
            background: rgba(0, 184, 148, 0.85);
        }

        .action-button-b:active {
            background: rgba(0, 184, 148, 1);
        }

        .action-button-x {
            background: rgba(108, 92, 231, 0.7);
        }

        .action-button-x:hover {
            background: rgba(108, 92, 231, 0.85);
        }

        .action-button-x:active {
            background: rgba(108, 92, 231, 1);
        }

        .action-button-y {
            background: rgba(253, 203, 110, 0.7);
        }

        .action-button-y:hover {
            background: rgba(253, 203, 110, 0.85);
        }

        .action-button-y:active {
            background: rgba(253, 203, 110, 1);
        }

        /* TECLADO VIRTUAL TRANSPARENTE */
        .virtual-keyboard-container {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.1);
            z-index: 9998;
            display: none;
            max-width: 95%;
            width: auto;
        }

        .keyboard {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 300px;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .key {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 8px;
            min-width: 40px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: all 0.1s ease;
            user-select: none;
            box-shadow: 
                0 2px 5px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .key:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .key:active {
            transform: translateY(1px);
            background: rgba(255, 255, 255, 0.35);
        }

        .key-wide {
            min-width: 60px;
        }

        .key-extra-wide {
            min-width: 80px;
        }

        .key-space {
            min-width: 200px !important;
            background: rgba(96, 206, 180, 0.7);
            font-weight: bold;
            font-size: 16px;
            padding: 15px 20px;
        }

        .key-space:hover {
            background: rgba(96, 206, 180, 0.85);
        }

        .key-space:active {
            background: rgba(96, 206, 180, 1);
        }

        .key-special {
            background: rgba(108, 92, 231, 0.4);
        }

        .key-special:hover {
            background: rgba(108, 92, 231, 0.6);
        }

        /* PANEL DE CONFIGURACIÓN TRANSPARENTE */
        .config-panel {
            position: fixed;
            bottom: 180px;
            right: 30px;
            background: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(30px);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.15);
            z-index: 10000;
            display: none;
            width: 300px;
            color: white;
        }

        .config-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .config-title {
            font-size: 18px;
            font-weight: bold;
            color: #6c5ce7;
        }

        .close-config {
            background: rgba(255, 107, 107, 0.7);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .close-config:hover {
            background: rgba(255, 107, 107, 0.9);
        }

        .config-group {
            margin-bottom: 20px;
        }

        .config-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
        }

        .config-select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 14px;
            backdrop-filter: blur(10px);
        }

        .config-select:focus {
            outline: none;
            border-color: #6c5ce7;
        }

        .config-button {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            background: rgba(108, 92, 231, 0.7);
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
            backdrop-filter: blur(10px);
        }

        .config-button:hover {
            background: rgba(108, 92, 231, 0.9);
            transform: translateY(-2px);
        }

        .config-button:active {
            transform: translateY(0);
        }

        .key-binding {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
        }

        .key-binding-label {
            flex: 1;
            font-size: 14px;
        }

        .key-binding-input {
            width: 80px;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: white;
            text-align: center;
            cursor: pointer;
        }

        .key-binding-input:focus {
            outline: none;
            border-color: #6c5ce7;
        }

        /* BOTONES DE ACCIÓN EXTRA */
        .extra-buttons-container {
            position: fixed;
            bottom: 220px;
            left: 30px;
            z-index: 9998;
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .extra-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(52, 152, 219, 0.7);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
            transition: all 0.2s ease;
        }

        .extra-button:hover {
            transform: scale(1.05);
            background: rgba(52, 152, 219, 0.85);
        }

        .extra-button:active {
            transform: scale(0.95);
            background: rgba(52, 152, 219, 1);
        }

        /* INDICADOR VISUAL */
        .control-indicator {
            position: fixed;
            bottom: 90px;
            right: 90px;
            background: rgba(46, 204, 113, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 12px;
            backdrop-filter: blur(10px);
            display: none;
            z-index: 9999;
            animation: fadeInOut 2s ease-in-out;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            10%, 90% { opacity: 1; }
        }

        /* ESTILOS PARA CONTROL ACTIVO */
        .controls-active #canvas {
            margin-bottom: 200px;
            transition: margin-bottom 0.3s ease;
        }

        /* TECLADO COMPACTO PARA MÓVIL */
        @media (max-width: 768px) {
            .virtual-keyboard-container {
                bottom: 80px;
                width: 98%;
                padding: 10px;
            }
            
            .key {
                min-width: 30px;
                padding: 10px 5px;
                font-size: 12px;
            }
            
            .key-space {
                min-width: 150px !important;
                font-size: 14px;
            }
            
            .joystick-container {
                bottom: 80px;
                left: 20px;
            }
            
            .action-buttons-container {
                bottom: 80px;
                right: 20px;
            }
            
            .extra-buttons-container {
                bottom: 200px;
                left: 20px;
            }
            
            .config-panel {
                width: 280px;
                right: 20px;
                bottom: 150px;
            }
        }
    </style>
  </head>
  <body>

  <!-- Botón único de controles -->
  <button class="control-toggle-button" id="controlToggle" title="Controles Virtuales">🎮</button>

  <!-- Indicador visual -->
  <div class="control-indicator" id="controlIndicator"></div>

  <!-- Joystick estilo Xbox Cloud -->
  <div class="joystick-container" id="joystickContainer">
      <div class="joystick-base">
          <div class="joystick-direction"></div>
          <div class="joystick-center"></div>
          <div class="joystick-thumb" id="joystickThumb"></div>
      </div>
  </div>

  <!-- Botones de acción -->
  <div class="action-buttons-container" id="actionButtons">
      <button class="action-button action-button-a" data-key=" ">A</button>
      <button class="action-button action-button-b" data-key="Control">B</button>
      <button class="action-button action-button-x" data-key="Shift">X</button>
      <button class="action-button action-button-y" data-key="Alt">Y</button>
  </div>

  <!-- Botones extra -->
  <div class="extra-buttons-container" id="extraButtons">
      <button class="extra-button" data-key="Enter" title="Start">⏵</button>
      <button class="extra-button" data-key="Escape" title="Back">⏮</button>
  </div>

  <!-- Teclado virtual transparente -->
  <div class="virtual-keyboard-container" id="virtualKeyboard">
      <div class="keyboard">
          <!-- Fila 1 -->
          <div class="keyboard-row">
              <div class="key" data-key="1">1</div>
              <div class="key" data-key="2">2</div>
              <div class="key" data-key="3">3</div>
              <div class="key" data-key="4">4</div>
              <div class="key" data-key="5">5</div>
              <div class="key" data-key="6">6</div>
              <div class="key" data-key="7">7</div>
              <div class="key" data-key="8">8</div>
              <div class="key" data-key="9">9</div>
              <div class="key" data-key="0">0</div>
              <div class="key key-wide" data-key="Backspace">⌫</div>
          </div>
          
          <!-- Fila 2 -->
          <div class="keyboard-row">
              <div class="key key-wide" data-key="Tab">Tab</div>
              <div class="key" data-key="q">Q</div>
              <div class="key" data-key="w">W</div>
              <div class="key" data-key="e">E</div>
              <div class="key" data-key="r">R</div>
              <div class="key" data-key="t">T</div>
              <div class="key" data-key="y">Y</div>
              <div class="key" data-key="u">U</div>
              <div class="key" data-key="i">I</div>
              <div class="key" data-key="o">O</div>
              <div class="key" data-key="p">P</div>
              <div class="key" data-key="Enter">↵</div>
          </div>
          
          <!-- Fila 3 -->
          <div class="keyboard-row">
              <div class="key key-special key-wide" data-key="CapsLock" id="capsLock">Caps</div>
              <div class="key" data-key="a">A</div>
              <div class="key" data-key="s">S</div>
              <div class="key" data-key="d">D</div>
              <div class="key" data-key="f">F</div>
              <div class="key" data-key="g">G</div>
              <div class="key" data-key="h">H</div>
              <div class="key" data-key="j">J</div>
              <div class="key" data-key="k">K</div>
              <div class="key" data-key="l">L</div>
              <div class="key key-special key-wide" data-key="Shift" id="shiftKey">Shift</div>
          </div>
          
          <!-- Fila 4 -->
          <div class="keyboard-row">
              <div class="key key-special" data-key="Control">Ctrl</div>
              <div class="key" data-key="z">Z</div>
              <div class="key" data-key="x">X</div>
              <div class="key" data-key="c">C</div>
              <div class="key" data-key="v">V</div>
              <div class="key" data-key="b">B</div>
              <div class="key" data-key="n">N</div>
              <div class="key" data-key="m">M</div>
              <div class="key" data-key=",">,</div>
              <div class="key" data-key=".">.</div>
              <div class="key" data-key="/">/</div>
              <div class="key key-special" data-key="Alt">Alt</div>
          </div>
          
          <!-- Fila 5 - BARRA ESPACIADORA COMPLETA -->
          <div class="keyboard-row">
              <div class="key key-space" data-key=" ">ESPACIO</div>
          </div>
      </div>
  </div>

  <!-- Panel de configuración transparente -->
  <div class="config-panel" id="configPanel">
      <div class="config-header">
          <div class="config-title">Configurar Controles</div>
          <button class="close-config" onclick="hideConfigPanel()">✕</button>
      </div>
      
      <div class="config-group">
          <label class="config-label">Tipo de Control:</label>
          <select class="config-select" id="controlType">
              <option value="joystick">🎮 Joystick</option>
              <option value="keyboard">⌨️ Teclado</option>
          </select>
      </div>
      
      <div class="config-group">
          <label class="config-label">Transparencia:</label>
          <select class="config-select" id="opacityLevel">
              <option value="0.8">80% - Alta</option>
              <option value="0.85" selected>85% - Media</option>
              <option value="0.9">90% - Baja</option>
              <option value="0.95">95% - Muy Baja</option>
          </select>
      </div>
      
      <div class="config-group">
          <label class="config-label">Sensibilidad Joystick:</label>
          <select class="config-select" id="joystickSensitivity">
              <option value="0.3">Baja</option>
              <option value="0.5" selected>Media</option>
              <option value="0.7">Alta</option>
              <option value="1.0">Muy Alta</option>
          </select>
      </div>
      
      <div class="config-group">
          <label class="config-label">Tamaño Botones:</label>
          <select class="config-select" id="buttonSize">
              <option value="small">Pequeño</option>
              <option value="normal" selected>Normal</option>
              <option value="large">Grande</option>
          </select>
      </div>
      
      <div id="keyBindings" style="display: none;">
          <div class="config-group">
              <div class="key-binding">
                  <span class="key-binding-label">Botón A:</span>
                  <input type="text" class="key-binding-input" id="keyA" value=" " readonly>
              </div>
              <div class="key-binding">
                  <span class="key-binding-label">Botón B:</span>
                  <input type="text" class="key-binding-input" id="keyB" value="Control" readonly>
              </div>
              <div class="key-binding">
                  <span class="key-binding-label">Botón X:</span>
                  <input type="text" class="key-binding-input" id="keyX" value="Shift" readonly>
              </div>
              <div class="key-binding">
                  <span class="key-binding-label">Botón Y:</span>
                  <input type="text" class="key-binding-input" id="keyY" value="Alt" readonly>
              </div>
          </div>
      </div>
      
      <button class="config-button" onclick="saveSettings()">💾 Guardar Configuración</button>
      <button class="config-button" style="background: rgba(52, 152, 219, 0.7);" onclick="resetSettings()">🔄 Restablecer</button>
  </div>

  <!-- CONTENIDO ORIGINAL DE WINEBOX -->
  <div id="loading">
      <figure id="spinner" style="overflow: visible;">
         <div class="spinner" style="margin-top: .5em; margin-left: auto; margin-right: auto;"></div>
      </figure>
      <div class="emscripten" id="status"></div>
  </div>
  <div id="run-inline" style="display: none">
      <button id="inline-runbtn" onclick="startInline()">inline</button>
  </div>

  <div id="inline">
      <div class="emscripten">
          <button id="saveFSImage" style="display: none" onclick="saveFSImage()">Save FS Image</button>         
          <button id="startbtn" style="display: none" onclick="start()">Start</button>
          <button id="uploadbtn" style="display: none" onclick="document.getElementById('upload').click()" >Add File(s)</button>
          <input style="display: none" id="upload" name="upload" onclick="document.getElementById('uploadbtn').click();" onchange="startWithFiles(event.target.files);"  type="file" multiple />
          <button id="downloadbtn" style="display: none" onclick="buildTree();">Get File(s)</button>
          <a style="display: none" id="modalLink" href="#openModal">Open</a>
          <a style="display: none" id="modalLinkExe" href="#openModalExe">Open</a>

        <span id="sound-checkbox" style="display: none">
            <input type="checkbox" id="soundToggle" onclick="toggleSound();" />Enable Sound
        </span>
        <input style="display: none" id="pointerLock" unchecked>
        <input style="display: none" id="showConsole" onclick="toggleConsoleAndKeyboard();" unchecked>
      </div>
      <div id="dropzone">
          <div class="emscripten_border">
              <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>
          </div>
      </div>
      <div>
          <textarea class="emscripten" id="output" rows="8" style="display: none"></textarea>
      </div>
      <div id="openModal" class="modalDialog">
          <div> <a href="#close" title="Close" class="close" onclick="done();">X</a>
              <div>
                  <h3>Get File(s)</h3>
                  <input id="selectedItem" type="text" size="50" readonly>
                  <button onclick="extract();">Get</button>
              </div>
              <div id="tree" class="scroll-style">
              </div>
              <div>
                  <h3 id="loadStatus">Loading...</h3>
              </div>
          </div>
      </div>
      <div id="openModalExe" class="modalDialog">
          <div> <a id="openModalExeClick" href="#close" title="Close" class="close">X</a>
              <div>
                  <h3>Execute</h3>
                  <div id="message"></div>
                  <div id="items" class="scroll-style"></div>
              </div>
          </div>
      </div>
      <hr>
  </div>

  <script src="fat.js"></script>
  <script src="jszip.js"></script>
  <script src="shell.js"></script>

  <!-- Script para controles virtuales mejorados -->
  <script>
      // ============= CONFIGURACIÓN Y ESTADO =============
      let currentControlType = localStorage.getItem('winebox_control_type') || 'joystick';
      let joystickActive = false;
      let isShiftActive = false;
      let isCapsActive = false;
      let isConfigOpen = false;
      let joystickInterval = null;
      
      // Mapeo de teclas
      const keyCodeMap = {
          'w': 87, 'a': 65, 's': 83, 'd': 68,
          ' ': 32, 'Control': 17, 'Shift': 16, 'Alt': 18,
          'Enter': 13, 'Escape': 27, 'Tab': 9, 'Backspace': 8,
          'ArrowUp': 38, 'ArrowDown': 40, 'ArrowLeft': 37, 'ArrowRight': 39,
          '1': 49, '2': 50, '3': 51, '4': 52, '5': 53,
          '6': 54, '7': 55, '8': 56, '9': 57, '0': 48
      };
      
      // Configuración guardada
      let settings = {
          opacity: 0.85,
          sensitivity: 0.5,
          buttonSize: 'normal',
          keyBindings: {
              a: ' ',
              b: 'Control',
              x: 'Shift',
              y: 'Alt'
          }
      };
      
      // ============= FUNCIONES PRINCIPALES =============
      
      // Función para alternar controles
      function toggleControls() {
          if (currentControlType === 'joystick') {
              showJoystick();
          } else {
              showKeyboard();
          }
      }
      
      // Mostrar joystick
      function showJoystick() {
          hideAllControls();
          document.getElementById('joystickContainer').style.display = 'block';
          document.getElementById('actionButtons').style.display = 'flex';
          document.getElementById('extraButtons').style.display = 'flex';
          currentControlType = 'joystick';
          updateToggleButton('🎮');
          showIndicator('Joystick Activado');
          saveControlType();
      }
      
      // Mostrar teclado
      function showKeyboard() {
          hideAllControls();
          document.getElementById('virtualKeyboard').style.display = 'block';
          currentControlType = 'keyboard';
          updateToggleButton('⌨️');
          showIndicator('Teclado Activado');
          saveControlType();
      }
      
      // Ocultar todos los controles
      function hideAllControls() {
          document.getElementById('joystickContainer').style.display = 'none';
          document.getElementById('actionButtons').style.display = 'none';
          document.getElementById('extraButtons').style.display = 'none';
          document.getElementById('virtualKeyboard').style.display = 'none';
          document.getElementById('configPanel').style.display = 'none';
          isConfigOpen = false;
      }
      
      // Actualizar botón toggle
      function updateToggleButton(icon) {
          const button = document.getElementById('controlToggle');
          button.innerHTML = icon;
      }
      
      // Mostrar indicador visual
      function showIndicator(text) {
          const indicator = document.getElementById('controlIndicator');
          indicator.textContent = text;
          indicator.style.display = 'block';
          setTimeout(() => {
              indicator.style.display = 'none';
          }, 2000);
      }
      
      // Guardar tipo de control
      function saveControlType() {
          localStorage.setItem('winebox_control_type', currentControlType);
      }
      
      // ============= SISTEMA DE JOYSTICK =============
      
      // Configurar joystick
      function setupJoystick() {
          const joystickThumb = document.getElementById('joystickThumb');
          const joystickBase = document.querySelector('.joystick-base');
          let isDragging = false;
          let startX, startY;
          let currentX = 0, currentY = 0;
          const maxDistance = 50;
          
          // Eventos de ratón
          joystickThumb.addEventListener('mousedown', startDrag);
          document.addEventListener('mousemove', drag);
          document.addEventListener('mouseup', stopDrag);
          
          // Eventos táctiles
          joystickThumb.addEventListener('touchstart', startDragTouch);
          document.addEventListener('touchmove', dragTouch);
          document.addEventListener('touchend', stopDrag);
          
          function startDrag(e) {
              e.preventDefault();
              isDragging = true;
              const rect = joystickBase.getBoundingClientRect();
              startX = rect.left + rect.width / 2;
              startY = rect.top + rect.height / 2;
              joystickThumb.style.transition = 'none';
          }
          
          function startDragTouch(e) {
              e.preventDefault();
              isDragging = true;
              const touch = e.touches[0];
              const rect = joystickBase.getBoundingClientRect();
              startX = rect.left + rect.width / 2;
              startY = rect.top + rect.height / 2;
              joystickThumb.style.transition = 'none';
          }
          
          function drag(e) {
              if (!isDragging) return;
              updatePosition(e.clientX, e.clientY);
          }
          
          function dragTouch(e) {
              if (!isDragging) return;
              const touch = e.touches[0];
              updatePosition(touch.clientX, touch.clientY);
          }
          
          function updatePosition(clientX, clientY) {
              const dx = clientX - startX;
              const dy = clientY - startY;
              
              // Calcular distancia
              const distance = Math.sqrt(dx * dx + dy * dy);
              const angle = Math.atan2(dy, dx);
              
              // Limitar distancia
              const limitedDistance = Math.min(distance, maxDistance);
              
              // Posición limitada
              currentX = Math.cos(angle) * limitedDistance;
              currentY = Math.sin(angle) * limitedDistance;
              
              // Actualizar posición visual
              joystickThumb.style.transform = `translate(-50%, -50%) translate(${currentX}px, ${currentY}px)`;
              
              // Enviar teclas según dirección
              sendJoystickInput(currentX, currentY);
          }
          
          function stopDrag() {
              if (!isDragging) return;
              isDragging = false;
              
              // Animación de retorno
              joystickThumb.style.transition = 'transform 0.3s ease-out';
              joystickThumb.style.transform = 'translate(-50%, -50%)';
              
              // Detener todas las teclas
              stopAllKeys();
          }
          
          // Enviar entrada del joystick
          function sendJoystickInput(x, y) {
              const threshold = 20;
              
              // Detener todas las teclas primero
              stopAllKeys();
              
              // Enviar teclas según dirección
              if (y < -threshold) sendKey('w', true); // Arriba
              if (y > threshold) sendKey('s', true);  // Abajo
              if (x < -threshold) sendKey('a', true); // Izquierda
              if (x > threshold) sendKey('d', true);  // Derecha
          }
          
          function stopAllKeys() {
              ['w', 'a', 's', 'd'].forEach(key => sendKey(key, false));
          }
      }
      
      // ============= SISTEMA DE TECLADO =============
      
      // Configurar teclado virtual
      function setupKeyboard() {
          const keys = document.querySelectorAll('.key');
          
          keys.forEach(key => {
              key.addEventListener('click', function() {
                  const keyValue = this.getAttribute('data-key');
                  
                  if (keyValue === 'Shift') {
                      toggleShift();
                  } else if (keyValue === 'CapsLock') {
                      toggleCaps();
                  } else {
                      sendKey(keyValue, true);
                      setTimeout(() => sendKey(keyValue, false), 100);
                  }
              });
              
              // Soporte táctil
              key.addEventListener('touchstart', function(e) {
                  e.preventDefault();
                  const keyValue = this.getAttribute('data-key');
                  
                  if (keyValue === 'Shift') {
                      toggleShift();
                  } else if (keyValue === 'CapsLock') {
                      toggleCaps();
                  } else {
                      sendKey(keyValue, true);
                  }
              });
              
              key.addEventListener('touchend', function(e) {
                  e.preventDefault();
                  const keyValue = this.getAttribute('data-key');
                  
                  if (keyValue !== 'Shift' && keyValue !== 'CapsLock') {
                      sendKey(keyValue, false);
                  }
              });
          });
          
          // Configurar botones de acción
          document.querySelectorAll('.action-button, .extra-button').forEach(button => {
              button.addEventListener('mousedown', function() {
                  const key = this.getAttribute('data-key');
                  if (key) sendKey(key, true);
              });
              
              button.addEventListener('mouseup', function() {
                  const key = this.getAttribute('data-key');
                  if (key) sendKey(key, false);
              });
              
              button.addEventListener('touchstart', function(e) {
                  e.preventDefault();
                  const key = this.getAttribute('data-key');
                  if (key) sendKey(key, true);
              });
              
              button.addEventListener('touchend', function(e) {
                  e.preventDefault();
                  const key = this.getAttribute('data-key');
                  if (key) sendKey(key, false);
              });
          });
      }
      
      // Alternar shift
      function toggleShift() {
          isShiftActive = !isShiftActive;
          const shiftKey = document.getElementById('shiftKey');
          if (shiftKey) {
              if (isShiftActive) {
                  shiftKey.style.background = 'rgba(108, 92, 231, 0.8)';
                  shiftKey.style.color = '#fff';
              } else {
                  shiftKey.style.background = 'rgba(108, 92, 231, 0.4)';
                  shiftKey.style.color = '#fff';
              }
          }
      }
      
      // Alternar caps lock
      function toggleCaps() {
          isCapsActive = !isCapsActive;
          const capsKey = document.getElementById('capsLock');
          if (capsKey) {
              if (isCapsActive) {
                  capsKey.style.background = 'rgba(0, 184, 148, 0.8)';
                  capsKey.style.color = '#fff';
              } else {
                  capsKey.style.background = 'rgba(108, 92, 231, 0.4)';
                  capsKey.style.color = '#fff';
              }
          }
      }
      
      // ============= ENVÍO DE TECLAS AL EMULADOR =============
      
      function sendKey(key, isKeyDown) {
          const canvas = document.getElementById('canvas');
          if (!canvas) return;
          
          // Aplicar shift si está activo
          let keyValue = key;
          if (isShiftActive && key.length === 1 && key.match(/[a-z]/)) {
              keyValue = key.toUpperCase();
          } else if (isCapsActive && key.length === 1 && key.match(/[a-z]/)) {
              keyValue = key.toUpperCase();
          }
          
          const keyCode = keyCodeMap[key] || key.charCodeAt(0);
          const eventType = isKeyDown ? 'keydown' : 'keyup';
          
          const event = new KeyboardEvent(eventType, {
              key: keyValue,
              code: 'Key' + (key.length === 1 ? key.toUpperCase() : key),
              keyCode: keyCode,
              which: keyCode,
              bubbles: true,
              cancelable: true
          });
          
          canvas.dispatchEvent(event);
          
          // También escribir en la consola si está visible
          const output = document.getElementById('output');
          if (output && output.style.display !== 'none' && isKeyDown) {
              if (key === 'Backspace') {
                  output.value = output.value.slice(0, -1);
              } else if (key === 'Enter') {
                  output.value += '\n';
              } else if (key === 'Tab') {
                  output.value += '    ';
              } else if (key.length === 1) {
                  output.value += keyValue;
              }
              output.scrollTop = output.scrollHeight;
          }
      }
      
      // ============= CONFIGURACIÓN Y AJUSTES =============
      
      // Mostrar panel de configuración
      function showConfigPanel() {
          document.getElementById('configPanel').style.display = 'block';
          isConfigOpen = true;
          loadSettings();
      }
      
      // Ocultar panel de configuración
      function hideConfigPanel() {
          document.getElementById('configPanel').style.display = 'none';
          isConfigOpen = false;
      }
      
      // Cargar configuración
      function loadSettings() {
          const saved = localStorage.getItem('winebox_controls_settings');
          if (saved) {
              settings = JSON.parse(saved);
          }
          
          // Aplicar a la interfaz
          document.getElementById('controlType').value = currentControlType;
          document.getElementById('opacityLevel').value = settings.opacity.toString();
          document.getElementById('joystickSensitivity').value = settings.sensitivity.toString();
          document.getElementById('buttonSize').value = settings.buttonSize;
          
          // Aplicar transparencia
          applyOpacity();
          applyButtonSize();
      }
      
      // Guardar configuración
      function saveSettings() {
          settings.opacity = parseFloat(document.getElementById('opacityLevel').value);
          settings.sensitivity = parseFloat(document.getElementById('joystickSensitivity').value);
          settings.buttonSize = document.getElementById('buttonSize').value;
          currentControlType = document.getElementById('controlType').value;
          
          localStorage.setItem('winebox_controls_settings', JSON.stringify(settings));
          localStorage.setItem('winebox_control_type', currentControlType);
          
          // Aplicar cambios
          applyOpacity();
          applyButtonSize();
          
          // Cambiar tipo de control si es necesario
          if (currentControlType === 'joystick') {
              showJoystick();
          } else {
              showKeyboard();
          }
          
          hideConfigPanel();
          showIndicator('Configuración Guardada');
      }
      
      // Restablecer configuración
      function resetSettings() {
          settings = {
              opacity: 0.85,
              sensitivity: 0.5,
              buttonSize: 'normal',
              keyBindings: {
                  a: ' ',
                  b: 'Control',
                  x: 'Shift',
                  y: 'Alt'
              }
          };
          
          currentControlType = 'joystick';
          
          document.getElementById('controlType').value = currentControlType;
          document.getElementById('opacityLevel').value = settings.opacity.toString();
          document.getElementById('joystickSensitivity').value = settings.sensitivity.toString();
          document.getElementById('buttonSize').value = settings.buttonSize;
          
          showIndicator('Configuración Restablecida');
      }
      
      // Aplicar transparencia
      function applyOpacity() {
          const opacity = settings.opacity;
          const elements = [
              '.joystick-base',
              '.action-button',
              '.extra-button',
              '.virtual-keyboard-container',
              '.config-panel'
          ];
          
          elements.forEach(selector => {
              document.querySelectorAll(selector).forEach(el => {
                  const currentBg = window.getComputedStyle(el).backgroundColor;
                  const rgba = currentBg.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*[\d.]+)?\)/);
                  if (rgba) {
                      el.style.background = `rgba(${rgba[1]}, ${rgba[2]}, ${rgba[3]}, ${opacity})`;
                  }
              });
          });
      }
      
      // Aplicar tamaño de botones
      function applyButtonSize() {
          const size = settings.buttonSize;
          let buttonSize, fontSize;
          
          switch(size) {
              case 'small':
                  buttonSize = '60px';
                  fontSize = '16px';
                  break;
              case 'large':
                  buttonSize = '100px';
                  fontSize = '24px';
                  break;
              default: // normal
                  buttonSize = '80px';
                  fontSize = '20px';
          }
          
          document.querySelectorAll('.action-button').forEach(btn => {
              btn.style.width = buttonSize;
              btn.style.height = buttonSize;
              btn.style.fontSize = fontSize;
          });
      }
      
      // ============= INTEGRACIÓN CON WINEBOX =============
      
      // Integración con consola
      function toggleConsoleAndKeyboard() {
          const consoleEl = document.getElementById('output');
          const showConsole = document.getElementById('showConsole');
          
          if (showConsole.checked) {
              consoleEl.style.display = '';
              // Mostrar teclado automáticamente
              if (currentControlType === 'keyboard') {
                  showKeyboard();
              } else {
                  showJoystick();
              }
          } else {
              consoleEl.style.display = 'none';
              hideAllControls();
          }
      }
      
      // Sobrescribir función original
      const originalToggleConsole = window.toggleConsole;
      window.toggleConsole = function() {
          toggleConsoleAndKeyboard();
      };
      
      // ============= INICIALIZACIÓN =============
      
      document.addEventListener('DOMContentLoaded', function() {
          // Cargar configuración guardada
          const savedType = localStorage.getItem('winebox_control_type');
          if (savedType) {
              currentControlType = savedType;
          }
          
          // Configurar controles
          setupJoystick();
          setupKeyboard();
          
          // Configurar botón toggle
          const toggleButton = document.getElementById('controlToggle');
          toggleButton.addEventListener('click', function(e) {
              e.stopPropagation();
              
              if (e.shiftKey || e.ctrlKey) {
                  // Mostrar configuración con modificador
                  showConfigPanel();
              } else {
                  // Alternar controles normal
                  toggleControls();
              }
          });
          
          // Click largo para configuración
          let longPressTimer;
          toggleButton.addEventListener('mousedown', function() {
              longPressTimer = setTimeout(() => {
                  showConfigPanel();
              }, 1000);
          });
          
          toggleButton.addEventListener('mouseup', function() {
              clearTimeout(longPressTimer);
          });
          
          toggleButton.addEventListener('touchstart', function(e) {
              longPressTimer = setTimeout(() => {
                  showConfigPanel();
              }, 1000);
          });
          
          toggleButton.addEventListener('touchend', function(e) {
              clearTimeout(longPressTimer);
          });
          
          // Cerrar configuración al hacer clic fuera
          document.addEventListener('click', function(e) {
              if (isConfigOpen && !document.getElementById('configPanel').contains(e.target)) {
                  hideConfigPanel();
              }
          });
          
          // Aplicar transparencia inicial
          loadSettings();
          
          // Mostrar controles automáticamente si la consola está visible
          setTimeout(() => {
              const consoleEl = document.getElementById('output');
              if (consoleEl && consoleEl.style.display !== 'none') {
                  if (currentControlType === 'joystick') {
                      showJoystick();
                  } else {
                      showKeyboard();
                  }
              }
          }, 1000);
          
          console.log('🎮 Sistema de controles mejorado cargado');
      });
      
      // API global para integración
      window.virtualControls = {
          showJoystick: showJoystick,
          showKeyboard: showKeyboard,
          hideAll: hideAllControls,
          showConfig: showConfigPanel,
          toggle: toggleControls
      };
  </script>

  <script>
  function startInline() {
      document.getElementById('run-inline').style.display = 'none';
      document.getElementById('loading').style.display = '';
      Config.isRunningInline = true;
      Config.urlParams = "p=dock";
      var script = document.createElement('script');
      script.src = "kernel.js";
      document.body.appendChild(script);
  }
  function addDefaultOnDemand(params) {
      if(! params.includes("root=") &&  ! params.includes("ondemand=")) {
          if(params.length >0) {
              params = params + "&";
          }
          params = params + "ondemand=root&root=dlls&inline-default-ondemand-root-overlay=dlls";
      }
      return params;
  }
  </script>
  <script async type="text/javascript" src="kernel.js"></script>

  </body>
