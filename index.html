// Detectar idioma del navegador (base)
function getBrowserLanguage() {
    const navLang = navigator.language || navigator.userLanguage;
    if (navLang.startsWith('es')) return 'es';
    if (navLang.startsWith('de')) return 'de';
    if (navLang.startsWith('fr')) return 'fr';
    if (navLang.startsWith('pt')) return 'pt';
    if (navLang.startsWith('it')) return 'it';
    if (navLang.startsWith('ru')) return 'ru';
    if (navLang.startsWith('zh')) return 'zh';
    if (navLang.startsWith('ja')) return 'ja';
    return 'en';
}

let currentLanguage = localStorage.getItem('winebox_language') || getBrowserLanguage();

function t(key) {
    return translations[currentLanguage]?.[key] || translations.en[key] || key;
}

function getLocalizedDescription(app) {
    // Verificar si la descripción es un objeto con idiomas (nuevo formato)
    if (app.description && typeof app.description === 'object') {
        // Si existe la traducción para el idioma actual, devolverla
        if (app.description[currentLanguage]) {
            return app.description[currentLanguage];
        }
        // Si no, devolver la versión en inglés como fallback
        if (app.description.en) {
            return app.description.en;
        }
        // Si no hay inglés, devolver el primer valor disponible
        const firstLang = Object.values(app.description)[0];
        if (firstLang) return firstLang;
    }
    // Formato antiguo: description es string directamente
    if (typeof app.description === 'string') {
        return app.description;
    }
    // Fallback final
    return "No description available";
}

function applyTranslations() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (el.tagName === 'INPUT' && el.getAttribute('data-i18n-placeholder')) {
            el.placeholder = t(key);
        } else {
            el.textContent = t(key);
        }
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (el.tagName === 'INPUT') el.placeholder = t(key);
    });
    const confirmMsg = document.getElementById('confirmMessage');
    if (confirmMsg && currentAppToUninstall) confirmMsg.textContent = `${t('uninstall_confirm')} "${currentAppToUninstall?.name || ''}"`;
    const noRecentDiv = document.querySelector('#recentApps p');
    if (noRecentDiv && recentApps.length === 0) noRecentDiv.textContent = t('no_recent');
    const noAppsDiv = document.querySelector('#appGrid p');
    if (noAppsDiv && currentApps.length === 0 && noAppsDiv.textContent !== t('no_apps')) noAppsDiv.textContent = t('no_apps');
    
    // Re-renderizar las apps actuales para actualizar las descripciones traducidas si el modal está cerrado
    if (!isModalOpen && currentApps.length > 0) {
        // Guardamos temporalmente el foco y selección
        const oldFocusArea = currentFocusArea;
        const oldSelectedIndex = currentSelectedIndex;
        displayApps(currentApps);
        currentFocusArea = oldFocusArea;
        currentSelectedIndex = oldSelectedIndex;
        updateSelection();
    }
}

function setLanguage(lang) {
    currentLanguage = lang;
    localStorage.setItem('winebox_language', lang);
    applyTranslations();
}

let currentAppToUninstall = null;
function isAppInstalled(appName) {
    const data = JSON.parse(localStorage.getItem('programManagerData'));
    if (!data) return false;
    return data.shortcuts.some(s => s.name === appName && s.type === 'web' && !s.isDiscoLocal && !s.isTrash);
}
function getInstalledApps() {
    const data = JSON.parse(localStorage.getItem('programManagerData'));
    if (!data) return [];
    const installed = data.shortcuts.filter(s => s.type === 'web' && !s.isDiscoLocal && !s.isTrash);
    return installed.map(shortcut => {
        const original = appData.find(a => a.name === shortcut.name);
        return original || { name: shortcut.name, image: shortcut.icon, category: 'installed', description: 'Installed app', link: shortcut.url };
    });
}
function installAppInProgramManager(app) {
    let pmData = JSON.parse(localStorage.getItem('programManagerData'));
    if (!pmData) {
        pmData = { shortcuts: [{ id: "disco-local", name: "Disco local", icon: SYSTEM_ICONS.discoLocal, isDiscoLocal: true, created: new Date().toISOString(), location: 'desktop' }, { id: "trash", name: "Papelera", icon: SYSTEM_ICONS.trash, isTrash: true, created: new Date().toISOString(), location: 'desktop' }], folders: [], trash: [], settings: { view: 'icons' } };
    } else {
        if (!pmData.shortcuts.some(s => s.isDiscoLocal)) pmData.shortcuts.unshift({ id: "disco-local", name: "Disco local", icon: SYSTEM_ICONS.discoLocal, isDiscoLocal: true, created: new Date().toISOString(), location: 'desktop' });
        if (!pmData.shortcuts.some(s => s.isTrash)) pmData.shortcuts.unshift({ id: "trash", name: "Papelera", icon: SYSTEM_ICONS.trash, isTrash: true, created: new Date().toISOString(), location: 'desktop' });
        pmData.shortcuts.forEach(s => { if(s.isDiscoLocal) s.icon = SYSTEM_ICONS.discoLocal; if(s.isTrash) s.icon = SYSTEM_ICONS.trash; });
    }
    if(pmData.shortcuts.some(s => s.name === app.name && s.type === 'web')) { showStatusMessage(`${app.name} ${t('status_already')}`, 'warning'); return; }
    pmData.shortcuts.push({ id: Date.now().toString(36)+Math.random().toString(36).substr(2), name: app.name, icon: app.image, type: 'web', url: app.link, created: new Date().toISOString(), location: 'desktop' });
    localStorage.setItem('programManagerData', JSON.stringify(pmData));
    showStatusMessage(`${app.name} ${t('status_installed')}`, 'success');
    setTimeout(() => location.reload(), 1500);
}
function removeFromRecentApps(app) {
    let recents = JSON.parse(localStorage.getItem('recentApps')) || [];
    recents = recents.filter(r => r.name !== app.name);
    localStorage.setItem('recentApps', JSON.stringify(recents));
    displayRecentApps();
}
function uninstallAppFromProgramManager(app) {
    const data = JSON.parse(localStorage.getItem('programManagerData'));
    if(!data) return;
    const lenBefore = data.shortcuts.length;
    data.shortcuts = data.shortcuts.filter(s => !(s.name === app.name && s.type === 'web' && !s.isDiscoLocal && !s.isTrash));
    if(data.shortcuts.length < lenBefore) {
        localStorage.setItem('programManagerData', JSON.stringify(data));
        removeFromRecentApps(app);
        showStatusMessage(`${app.name} ${t('status_uninstalled')}`, 'success');
        setTimeout(() => location.reload(), 1500);
        closeConfirmModal();
    } else { showStatusMessage(t('status_notfound'), 'warning'); closeConfirmModal(); }
}
function showConfirmModal(app) {
    currentAppToUninstall = app;
    const modal = document.getElementById('confirmModal');
    document.getElementById('confirmTitle').textContent = t('confirm_title');
    document.getElementById('confirmMessage').textContent = `${t('uninstall_confirm')} "${app.name}"`;
    modal.style.display = 'block';
}
function closeConfirmModal() { document.getElementById('confirmModal').style.display = 'none'; currentAppToUninstall = null; }
function showStatusMessage(msg, type='success') {
    const el = document.getElementById('statusMessage');
    el.textContent = msg;
    el.style.backgroundColor = type==='warning'?'#ff9800':type==='error'?'#f44336':'#0078d4';
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 3000);
}

function openVirtualAppWindow(app) {
    const virtualWin = document.getElementById('virtualWindow');
    if (virtualWin && virtualWin.style.display === 'flex') closeVirtualWindow();
    const iframe = document.getElementById('virtualAppIframe');
    iframe.src = app.link;
    virtualWin.style.display = 'flex';
    document.body.style.overflow = 'hidden';
    const escHandler = function(e) { if (e.key === 'Escape') { closeVirtualWindow(); document.removeEventListener('keydown', escHandler); } };
    document.addEventListener('keydown', escHandler);
    virtualWin._escHandler = escHandler;
    document.getElementById('closeVirtualWindowBtn').onclick = () => closeVirtualWindow();
}
function closeVirtualWindow() {
    const virtualWin = document.getElementById('virtualWindow');
    const iframe = document.getElementById('virtualAppIframe');
    if (!virtualWin) return;
    virtualWin.style.display = 'none';
    iframe.src = 'about:blank';
    document.body.style.overflow = '';
    if (virtualWin._escHandler) { document.removeEventListener('keydown', virtualWin._escHandler); delete virtualWin._escHandler; }
}

function displayRecentApps() {
    recentAppsContainer.innerHTML = '';
    if (recentApps.length === 0) { 
        const p = document.createElement('p');
        p.style.color = '#666'; p.style.padding = '10px';
        p.textContent = t('no_recent');
        recentAppsContainer.appendChild(p);
        return; 
    }
    for (let i=0; i<recentApps.length; i++) {
        let app = recentApps[i];
        let full = appData.find(a=>a.name === app.name) || app;
        const wrapper = document.createElement('div');
        wrapper.style.position = 'relative'; wrapper.style.display = 'inline-block';
        const img = document.createElement('img');
        img.src = full.image || 'https://via.placeholder.com/160x160/333333/FFFFFF?text=App';
        img.className = 'recent-app';
        img.title = full.name;
        img.setAttribute('data-index', i);
        img.setAttribute('data-app-name', full.name);
        const infoDiv = document.createElement('div');
        infoDiv.className = 'selected-app-info';
        infoDiv.textContent = full.name;
        img.addEventListener('click', function() {
            const idx = parseInt(this.getAttribute('data-index'));
            const selectedRecent = recentApps[idx];
            const appFull = appData.find(a=>a.name === selectedRecent.name) || selectedRecent;
            openAppModal(appFull);
        });
        wrapper.appendChild(img); wrapper.appendChild(infoDiv);
        recentAppsContainer.appendChild(wrapper);
    }
    if (recentApps.length && currentFocusArea === 'recent') { currentRecentIndex = 0; updateSelection(); }
    setTimeout(updateScrollIndicator, 100);
}

function displayApps(apps) {
    appGrid.innerHTML = '';
    currentApps = apps;
    if (!apps.length) { 
        const p = document.createElement('p');
        p.style.color = '#666'; p.style.gridColumn = '1/-1'; p.style.textAlign = 'center';
        p.textContent = t('no_apps');
        appGrid.appendChild(p);
        return; 
    }
    for (let i=0; i<apps.length; i++) {
        const app = apps[i];
        const card = document.createElement('div');
        card.className = 'app-card';
        if (i === currentSelectedIndex && currentFocusArea === 'apps') card.className += ' selected';
        let extra = (currentCategory === 'uninstall') ? `<div style="color: #ff6b6b; font-size: 11px; margin-top: 5px;">${t('uninstall_button')}</div>` : '';
        card.innerHTML = `<img src="${app.image}" alt="${app.name}" class="app-thumbnail"><div class="app-info"><div class="app-title">${app.name}</div><div class="app-category">${app.category}</div>${extra}</div>`;
        card.addEventListener('click', (function(a) { return function() { if (currentCategory === 'uninstall') showConfirmModal(a); else { openAppModal(a); addToRecentApps(a); } }; })(app));
        appGrid.appendChild(card);
    }
    if (currentApps.length && currentSelectedIndex === -1 && currentFocusArea === 'apps') { currentSelectedIndex = 0; updateSelection(); }
}

function updateSelection() {
    const recentImgs = document.querySelectorAll('.recent-app');
    for (let i=0; i<recentImgs.length; i++) {
        const el = recentImgs[i];
        if (parseInt(el.getAttribute('data-index')) === currentRecentIndex && currentFocusArea === 'recent') {
            el.classList.add('selected');
            const name = el.getAttribute('data-app-name');
            selectedAppInfo.textContent = name;
            selectedAppInfo.style.left = el.offsetLeft + 'px';
            selectedAppInfo.style.width = el.offsetWidth + 'px';
            el.scrollIntoViewIfNeeded ? el.scrollIntoViewIfNeeded() : el.scrollIntoView();
        } else el.classList.remove('selected');
    }
    categoryButtons.forEach((btn, idx) => { if (idx === currentCategoryIndex && currentFocusArea === 'categories') btn.classList.add('selected'); else btn.classList.remove('selected'); });
    const cards = document.querySelectorAll('.app-card');
    cards.forEach((c, i) => { if (i === currentSelectedIndex && currentFocusArea === 'apps') c.classList.add('selected'); else c.classList.remove('selected'); });
    menuItems.forEach((item, idx) => { if (idx === currentMenuItemIndex && currentFocusArea === 'menu') item.classList.add('selected'); else item.classList.remove('selected'); });
}

function addToRecentApps(app) {
    let newRecents = recentApps.filter(r => r.name !== app.name);
    newRecents.unshift({ name: app.name, image: app.image, link: app.link });
    if (newRecents.length > 16) newRecents = newRecents.slice(0, 16);
    recentApps = newRecents;
    localStorage.setItem('recentApps', JSON.stringify(recentApps));
    displayRecentApps();
}

function openAppModal(app) {
    isModalOpen = true;
    const details = document.getElementById('appDetails');
    const modal = document.getElementById('appModal');
    // Usar la descripción localizada
    const localizedDesc = getLocalizedDescription(app);
    details.innerHTML = `<h2>${app.name}</h2><img src="${app.image}" style="max-width:200px; border-radius:8px;"><p><strong>${t('cat_all')}:</strong> ${app.category}</p><p><strong>${t('run_button')}:</strong> ${localizedDesc}</p>`;
    const launchBtn = document.getElementById('launchButton');
    launchBtn.onclick = function() { openVirtualAppWindow(app); addToRecentApps(app); closeModal(); };
    const installBtn = document.getElementById('installButton');
    const uninstallBtn = document.getElementById('uninstallButton');
    const installed = isAppInstalled(app.name);
    if (installed) {
        installBtn.style.display = 'none';
        uninstallBtn.style.display = 'inline-block';
        uninstallBtn.onclick = function() { showConfirmModal(app); closeModal(); };
    } else {
        installBtn.style.display = 'inline-block';
        uninstallBtn.style.display = 'none';
        installBtn.onclick = function() { installAppInProgramManager(app); closeModal(); };
    }
    modal.style.display = 'block';
    currentSelectedIndex = -1;
}

function closeModal() { isModalOpen = false; document.getElementById('appModal').style.display = 'none'; if (currentApps.length && currentFocusArea === 'apps') { currentSelectedIndex = Math.min(currentSelectedIndex, currentApps.length-1); updateSelection(); } }
function toggleMenu() { isMenuOpen = !isMenuOpen; if(isMenuOpen) { sideMenu.classList.add('open'); menuOverlay.classList.add('open'); currentFocusArea = 'menu'; currentMenuItemIndex = 0; } else { sideMenu.classList.remove('open'); menuOverlay.classList.remove('open'); currentFocusArea = 'recent'; currentMenuItemIndex = -1; } updateSelection(); }
function handleUpArrow() { if (isMenuOpen) { if(currentMenuItemIndex>0) currentMenuItemIndex--; updateSelection(); return; } if (currentFocusArea === 'apps' && currentApps.length) { let cols = Math.floor(appGrid.offsetWidth / (240+25)); if(currentSelectedIndex >= cols) { currentSelectedIndex -= cols; updateSelection(); } else { currentFocusArea='categories'; currentCategoryIndex = Math.min(currentCategoryIndex, categoryButtons.length-1); updateSelection(); } } else if(currentFocusArea==='categories') { currentFocusArea='recent'; if(recentApps.length) { currentRecentIndex=0; updateSelection(); } } }
function handleDownArrow() { if (isMenuOpen) { if(currentMenuItemIndex<menuItems.length-1) currentMenuItemIndex++; updateSelection(); return; } if(currentFocusArea==='recent') { currentFocusArea='categories'; currentCategoryIndex = Math.min(currentCategoryIndex, categoryButtons.length-1); updateSelection(); } else if(currentFocusArea==='categories') { currentFocusArea='apps'; currentSelectedIndex = (currentApps.length?0:-1); updateSelection(); } else if(currentFocusArea==='apps' && currentApps.length) { let cols = Math.floor(appGrid.offsetWidth/(240+25)); if(currentSelectedIndex+cols < currentApps.length) { currentSelectedIndex+=cols; updateSelection(); } } }
function handleLeftArrow() { if(isMenuOpen) return; if(currentFocusArea==='recent' && currentRecentIndex>0) { currentRecentIndex--; updateSelection(); } else if(currentFocusArea==='categories' && currentCategoryIndex>0) { currentCategoryIndex--; updateSelection(); } else if(currentFocusArea==='apps' && currentSelectedIndex>0) { currentSelectedIndex--; updateSelection(); } }
function handleRightArrow() { if(isMenuOpen) return; if(currentFocusArea==='recent' && currentRecentIndex<recentApps.length-1) { currentRecentIndex++; updateSelection(); } else if(currentFocusArea==='categories' && currentCategoryIndex<categoryButtons.length-1) { currentCategoryIndex++; updateSelection(); } else if(currentFocusArea==='apps' && currentSelectedIndex<currentApps.length-1) { currentSelectedIndex++; updateSelection(); } }
function handleEnter() { if(isMenuOpen && currentMenuItemIndex>=0) { menuItems[currentMenuItemIndex].click(); return; } if(currentFocusArea==='recent' && currentRecentIndex>=0) { const ra = recentApps[currentRecentIndex]; const full = appData.find(a=>a.name===ra.name)||ra; openAppModal(full); } else if(currentFocusArea==='categories') { categoryButtons[currentCategoryIndex].click(); currentFocusArea='apps'; currentSelectedIndex=0; updateSelection(); } else if(currentFocusArea==='apps' && currentSelectedIndex>=0) { openAppModal(currentApps[currentSelectedIndex]); } }
function toggleFocusArea() { if(isMenuOpen) toggleMenu(); else { if(currentFocusArea==='recent') { currentFocusArea='categories'; currentCategoryIndex = Math.min(currentCategoryIndex, categoryButtons.length-1); } else if(currentFocusArea==='categories') { currentFocusArea='apps'; if(currentApps.length) currentSelectedIndex=0; } else if(currentFocusArea==='apps') { currentFocusArea='recent'; if(recentApps.length) currentRecentIndex=0; } updateSelection(); } }
function playNavSound() { if(navSound) { navSound.currentTime=0; try{ navSound.play(); }catch(e){} } }
function updateScrollIndicator() { const isEnd = recentAppsEl.scrollWidth <= recentAppsEl.scrollLeft + recentAppsEl.clientWidth + 1; scrollIndicator.style.display = isEnd ? 'none' : 'flex'; }
function clearSearch() { searchInput.value=''; currentCategory='all'; displayApps(appData); currentSelectedIndex=0; currentFocusArea='apps'; categoryButtons.forEach(b=>b.classList.remove('active')); categoryButtons[0].classList.add('active'); updateSelection(); }

document.addEventListener('keydown', e => {
    if(isModalOpen) { if(e.key==='Escape') closeModal(); else if(e.key==='Enter') document.getElementById('launchButton').click(); return; }
    if(document.getElementById('confirmModal').style.display==='block') { if(e.key==='Escape') closeConfirmModal(); return; }
    if(document.getElementById('virtualWindow').style.display === 'flex') { if(e.key === 'Escape') closeVirtualWindow(); return; }
    switch(e.key) {
        case 'ArrowUp': e.preventDefault(); playNavSound(); handleUpArrow(); break;
        case 'ArrowDown': e.preventDefault(); playNavSound(); handleDownArrow(); break;
        case 'ArrowLeft': e.preventDefault(); playNavSound(); handleLeftArrow(); break;
        case 'ArrowRight': e.preventDefault(); playNavSound(); handleRightArrow(); break;
        case 'Enter': e.preventDefault(); playNavSound(); handleEnter(); break;
        case 'Tab': e.preventDefault(); playNavSound(); toggleFocusArea(); break;
        case 'Escape': if(isMenuOpen) { e.preventDefault(); playNavSound(); toggleMenu(); } else if(searchInput.value.trim()) { e.preventDefault(); clearSearch(); } break;
    }
});
scrollIndicator.addEventListener('click', () => { recentAppsEl.scrollLeft += 200; setTimeout(updateScrollIndicator,300); });
recentAppsEl.addEventListener('scroll', () => { if(!isScrolling) { isScrolling=true; setTimeout(()=>{ updateScrollIndicator(); isScrolling=false; },100); } });
menuButton.addEventListener('click', () => { playNavSound(); toggleMenu(); });
menuOverlay.addEventListener('click', () => { playNavSound(); toggleMenu(); });
menuItems.forEach(item => { item.addEventListener('click', function() { let cat = this.getAttribute('data-category'); currentCategory = cat; let filtered = cat==='all'?appData:cat==='uninstall'?getInstalledApps():appData.filter(a=>a.category===cat); displayApps(filtered); currentSelectedIndex=0; currentFocusArea='apps'; updateSelection(); toggleMenu(); }); });
categoryButtons.forEach((btn, idx) => { btn.addEventListener('click', function() { categoryButtons.forEach(b=>b.classList.remove('active')); this.classList.add('active'); let cat = this.getAttribute('data-category'); currentCategory=cat; let filtered = cat==='all'?appData:appData.filter(a=>a.category===cat); displayApps(filtered); currentSelectedIndex=0; currentFocusArea='apps'; updateSelection(); }); });
searchButton.addEventListener('click', () => { let q = searchInput.value.trim(); if(q) { 
    let filtered = appData.filter(a => {
        const nameMatch = a.name.toLowerCase().includes(q.toLowerCase());
        const descMatch = getLocalizedDescription(a).toLowerCase().includes(q.toLowerCase());
        return nameMatch || descMatch;
    });
    currentCategory='search'; displayApps(filtered); currentSelectedIndex=0; currentFocusArea='apps'; updateSelection(); 
} });
searchInput.addEventListener('keypress', e => { if(e.key==='Enter') { let q = searchInput.value.trim(); if(q) { 
    let filtered = appData.filter(a => {
        const nameMatch = a.name.toLowerCase().includes(q.toLowerCase());
        const descMatch = getLocalizedDescription(a).toLowerCase().includes(q.toLowerCase());
        return nameMatch || descMatch;
    });
    currentCategory='search'; displayApps(filtered); currentSelectedIndex=0; currentFocusArea='apps'; updateSelection(); 
} } });
searchInput.addEventListener('keydown', e => { if(e.key==='Escape' && searchInput.value.trim()) clearSearch(); });
document.querySelector('.close').onclick = closeModal;
window.onclick = function(e) { if(e.target == document.getElementById('appModal')) closeModal(); if(e.target == document.getElementById('confirmModal')) closeConfirmModal(); };

let isScrolling = false;
displayApps(appData);
displayRecentApps();
if(recentApps.length) { currentRecentIndex = 0; updateSelection(); }

// Inicializar selector de idioma compacto
const langToggle = document.getElementById('langToggle');
const langMenu = document.getElementById('langMenu');
const langOptions = document.querySelectorAll('.lang-option');

langToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    langMenu.classList.toggle('show');
});

document.addEventListener('click', () => {
    langMenu.classList.remove('show');
});

langOptions.forEach(opt => {
    opt.addEventListener('click', () => {
        const lang = opt.getAttribute('data-lang');
        setLanguage(lang);
        langMenu.classList.remove('show');
    });
});

setLanguage(currentLanguage);
</script>
</body>
</html>
