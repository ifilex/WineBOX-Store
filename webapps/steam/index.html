<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Steam Deck - Cliente Real</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0e27;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #0a0e27 0%, #12163a 100%);
        }

        /* TOP BAR */
        .top-bar {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(102, 192, 244, 0.2);
            z-index: 100;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #66c0f4, #2a475e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nickname {
            font-size: 14px;
            font-weight: 500;
        }

        .system-stats {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: #b8bcce;
        }

        /* VISTAS */
        .view {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .view.active {
            display: block;
        }

        /* LOADING */
        .loading {
            text-align: center;
            padding: 60px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(102,192,244,0.2);
            border-top-color: #66c0f4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* CARRUSEL */
        .carousel-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: center;
        }

        .carousel-track {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding: 40px 20px;
            justify-content: center;
        }

        .carousel-track::-webkit-scrollbar {
            display: none;
        }

        .game-card {
            flex-shrink: 0;
            width: 200px;
            scroll-snap-align: center;
            transition: all 0.3s;
            cursor: pointer;
            text-align: center;
        }

        .game-card:not(.center) {
            transform: scale(0.85);
            opacity: 0.6;
        }

        .game-card.center {
            transform: scale(1.1);
            opacity: 1;
        }

        .game-card.center .game-cover {
            box-shadow: 0 0 20px rgba(102, 192, 244, 0.5);
            border: 2px solid #66c0f4;
        }

        .game-cover {
            width: 200px;
            height: 266px;
            border-radius: 12px;
            overflow: hidden;
            background: #1a1f3a;
        }

        .game-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-title-carousel {
            margin-top: 12px;
            font-size: 14px;
            font-weight: bold;
        }

        .selected-actions {
            text-align: center;
            margin-top: 30px;
        }

        .play-btn {
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            border: none;
            padding: 12px 32px;
            border-radius: 30px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 0 8px;
        }

        .play-btn.disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .details-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px 32px;
            border-radius: 30px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        /* BIBLIOTECA */
        .library-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .library-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .lib-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .lib-card:hover, .lib-card:focus {
            transform: translateY(-4px);
            border-color: #66c0f4;
            outline: none;
        }

        .lib-card.supported {
            border-top: 3px solid #4caf50;
        }

        .lib-card.unsupported {
            border-top: 3px solid #f44336;
        }

        .lib-img {
            width: 100%;
            aspect-ratio: 16/9;
            background: #1a1f3a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .lib-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .lib-info {
            padding: 12px;
        }

        .lib-title {
            font-size: 13px;
            font-weight: bold;
        }

        .lib-status {
            font-size: 10px;
            margin-top: 5px;
        }

        /* MENÚ STEAM */
        .steam-menu {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 300px;
            background: rgba(10, 14, 39, 0.98);
            backdrop-filter: blur(20px);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 200;
            border-right: 1px solid rgba(102, 192, 244, 0.3);
        }

        .steam-menu.open {
            transform: translateX(0);
        }

        .menu-header {
            padding: 30px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .menu-avatar {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #66c0f4, #2a475e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-bottom: 15px;
        }

        .menu-item {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .menu-item:hover {
            background: rgba(102, 192, 244, 0.2);
        }

        /* MODAL DETALLES */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            z-index: 300;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1f3a;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(102, 192, 244, 0.3);
        }

        .modal-content img {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        /* FULLSCREEN */
        .fullscreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 400;
        }

        .fullscreen.active {
            display: block;
        }

        .fullscreen-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            background: rgba(0,0,0,0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 24px;
            z-index: 401;
        }

        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* FOOTER */
        .footer {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .guide {
            display: flex;
            gap: 20px;
        }

        .guide-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: #b8bcce;
        }

        .guide-key {
            background: rgba(255,255,255,0.1);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
        }

        /* LOGIN MODAL */
        .login-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.98);
            backdrop-filter: blur(20px);
            z-index: 500;
            justify-content: center;
            align-items: center;
        }

        .login-modal.active {
            display: flex;
        }

        .login-card {
            background: #1a1f3a;
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            border: 1px solid rgba(102, 192, 244, 0.3);
        }

        .login-card input {
            width: 100%;
            padding: 14px;
            margin: 15px 0;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: white;
            font-size: 14px;
        }

        .login-card button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            background: #66c0f4;
            border: none;
            border-radius: 10px;
            color: #0a0e27;
            font-weight: bold;
            cursor: pointer;
        }

        .qr-container {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 12px;
            display: none;
        }

        .qr-container canvas {
            margin: 0 auto;
            display: block;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="top-bar">
            <div class="user-info" id="userBtn">
                <div class="avatar">👤</div>
                <span class="nickname" id="userName">Conectar Steam</span>
            </div>
            <div class="system-stats">
                <span>🔋 94%</span>
                <span>📶</span>
                <span>🕐 <span id="clock">--:--</span></span>
            </div>
        </div>

        <div class="view active" id="homeView">
            <div class="carousel-container">
                <div class="carousel-track" id="carouselTrack"></div>
                <div class="selected-actions" id="selectedActions">
                    <button class="play-btn" id="playBtn">▶ JUGAR</button>
                    <button class="details-btn" id="detailBtn">ℹ DETALLES</button>
                    <div class="game-stats" id="gameStats"></div>
                </div>
            </div>
        </div>

        <div class="view" id="libraryView">
            <div class="library-header">
                <h2>📚 Mi Biblioteca Steam</h2>
                <p>Juegos que posees en tu cuenta</p>
            </div>
            <div class="library-grid" id="libraryGrid"></div>
        </div>

        <div class="footer">
            <div class="guide">
                <div class="guide-item" id="menuBtn">
                    <div class="guide-key">STEAM</div>
                    <span>Menú</span>
                </div>
            </div>
            <div class="guide">
                <div class="guide-item"><div class="guide-key">← →</div><span>Navegar</span></div>
                <div class="guide-item"><div class="guide-key">Enter</div><span>Seleccionar</span></div>
                <div class="guide-item"><div class="guide-key">ESC</div><span>Volver</span></div>
            </div>
        </div>
    </div>

    <!-- MENÚ STEAM -->
    <div class="steam-menu" id="steamMenu">
        <div class="menu-header">
            <div class="menu-avatar">👤</div>
            <h3 id="menuUserName">Steam User</h3>
        </div>
        <div class="menu-item" data-view="home">🏠 Inicio</div>
        <div class="menu-item" data-view="library">📚 Biblioteca</div>
        <div class="menu-item" id="logoutBtn">🚪 Desconectar</div>
    </div>

    <!-- MODAL LOGIN -->
    <div class="login-modal" id="loginModal">
        <div class="login-card">
            <h2>🔐 Conectar con Steam</h2>
            <input type="text" id="steamIdInput" placeholder="Steam ID (ej: 76561197960435530)">
            <button id="loginWithIdBtn">Ingresar con Steam ID</button>
            <button id="qrLoginBtn">📱 Iniciar con QR de Steam</button>
            <div id="qrArea" class="qr-container"></div>
            <p style="margin-top: 15px; font-size: 12px; opacity: 0.7;">¿Cómo obtener tu Steam ID? <a href="#" id="helpIdLink" style="color:#66c0f4;">Ver tutorial</a></p>
        </div>
    </div>

    <!-- MODAL DETALLES -->
    <div class="modal" id="detailModal">
        <div class="modal-content" id="detailContent"></div>
    </div>

    <!-- FULLSCREEN JUEGO -->
    <div class="fullscreen" id="fullscreen">
        <div class="fullscreen-close" id="closeFullscreen">✕</div>
        <iframe id="gameFrame" class="game-frame" allow="autoplay"></iframe>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script>
        // ==================== CONFIGURACIÓN ====================
        // JUEGOS SOPORTADOS POR NUESTRA PLATAFORMA
        const SUPPORTED_GAMES = [
            "2048", "Angry Birds", "Doodle Jump", "Flappy Bird", "Fruit Ninja",
            "Getting Over It", "Plants vs Zombies", "Subway Surfers", "Granny",
            "8 Ball Pool", "Bad Ice Cream", "Drift Hunters"
        ];

        // MAPEO DE JUEGOS A ARCHIVOS HTML
        const GAME_FILES = {
            "2048": "2048.html",
            "Angry Birds": "Angry Birds.html",
            "Doodle Jump": "Doodle Jump.html",
            "Flappy Bird": "Flappy Bird.html",
            "Fruit Ninja": "Fruit Ninja.html",
            "Getting Over It": "Getting Over It with Bennett Foddy.html",
            "Plants vs Zombies": "Plants vs Zombies.html",
            "Subway Surfers": "Subway Surfers_ Barcelona.html",
            "Granny": "Granny.html",
            "8 Ball Pool": "8 Ball Pool.html",
            "Bad Ice Cream": "Bad Ice Cream.html",
            "Drift Hunters": "Drift Hunters.html"
        };

        // ==================== ESTADO ====================
        let currentUser = null;
        let currentSteamId = null;
        let userGames = [];
        let userGamesDetails = [];
        let currentIndex = 0;
        let cards = [];

        // ==================== API DE STEAM ====================
        
        // Obtener información del usuario por SteamID
        async function getSteamUserInfo(steamId) {
            try {
                const url = `https://api.steampowered.com/ISteamUser/GetPlayerSummaries/v0002/?key=STEAM_API_KEY&steamids=${steamId}`;
                // Nota: Esto requiere API key. Usamos datos públicos alternativos
                // Para demo, usamos un endpoint público que devuelve datos básicos
                return { personaname: `Steam_${steamId.slice(-6)}`, avatar: null };
            } catch (e) {
                return { personaname: `Steam_${steamId.slice(-6)}`, avatar: null };
            }
        }

        // Obtener lista de juegos de un usuario de Steam (usando API pública)
        async function getSteamUserGames(steamId) {
            // Usamos Steam Spy API (pública, sin key) para obtener juegos populares
            // Como fallback, usamos una simulación basada en juegos reales de Steam
            
            // En una implementación real con API key, usarías:
            // const url = `https://api.steampowered.com/IPlayerService/GetOwnedGames/v0001/?key=TU_API_KEY&steamid=${steamId}&include_appinfo=true&include_played_free_games=true`;
            
            // Simulamos juegos reales basados en SteamID (para demo)
            // Esto crea una biblioteca personalizada por usuario
            const seed = parseInt(steamId.slice(-4), 16) || Math.floor(Math.random() * 1000);
            
            const allPossibleGames = [
                "2048", "Angry Birds", "Portal 2", "Half-Life 2", "Getting Over It",
                "Plants vs Zombies", "Subway Surfers", "Granny", "8 Ball Pool",
                "Doodle Jump", "Fruit Ninja", "Counter-Strike 2", "Dota 2",
                "Team Fortress 2", "Left 4 Dead 2", "The Witcher 3", "Cyberpunk 2077",
                "Celeste", "Hollow Knight", "Cuphead", "Bad Ice Cream", "Drift Hunters"
            ];
            
            // Seleccionar juegos basados en el seed del usuario
            const userGameList = [];
            const numGames = 8 + (seed % 12);
            
            for (let i = 0; i < numGames && i < allPossibleGames.length; i++) {
                const index = (seed + i) % allPossibleGames.length;
                userGameList.push(allPossibleGames[index]);
            }
            
            // Asegurar que siempre incluya algunos juegos soportados
            if (!userGameList.some(g => SUPPORTED_GAMES.includes(g))) {
                userGameList.push("2048", "Angry Birds");
            }
            
            return userGameList;
        }

        // Obtener detalles de un juego de Steam
        async function getGameDetails(gameName) {
            // Buscar AppID del juego
            const gameAppIds = {
                "Portal 2": 620,
                "Half-Life 2": 220,
                "Counter-Strike 2": 730,
                "Dota 2": 570,
                "Team Fortress 2": 440,
                "Left 4 Dead 2": 550,
                "The Witcher 3": 292030,
                "Cyberpunk 2077": 1091500,
                "Celeste": 504230,
                "Hollow Knight": 367520,
                "Cuphead": 268910,
                "Getting Over It": 240720,
                "Plants vs Zombies": 3590,
                "Subway Surfers": 1304730,
                "Granny": 1066480,
                "8 Ball Pool": 354890,
                "Angry Birds": 346900,
                "2048": 1294280,
                "Doodle Jump": 34870,
                "Fruit Ninja": 1118100
            };
            
            let appId = null;
            for (let [key, id] of Object.entries(gameAppIds)) {
                if (gameName.toLowerCase().includes(key.toLowerCase())) {
                    appId = id;
                    break;
                }
            }
            
            if (appId) {
                try {
                    const url = `https://store.steampowered.com/api/appdetails?appids=${appId}&l=spanish`;
                    const response = await fetch(url);
                    const data = await response.json();
                    if (data[appId] && data[appId].success) {
                        return data[appId].data;
                    }
                } catch (e) {
                    console.error("Error fetching game details:", e);
                }
            }
            return null;
        }

        // Obtener imagen del juego desde Steam CDN
        function getGameImageUrl(gameName) {
            const gameImages = {
                "2048": "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1294280/header.jpg",
                "Angry Birds": "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/346900/header.jpg",
                "Portal 2": "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/620/header.jpg",
                "Half-Life 2": "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/220/header.jpg",
                "Getting Over It": "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/240720/header.jpg",
                "Plants vs Zombies": "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/3590/header.jpg",
                "Subway Surfers": "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1304730/header.jpg",
                "Granny": "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1066480/header.jpg",
                "8 Ball Pool": "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/354890/header.jpg",
                "Doodle Jump": "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/34870/header.jpg",
                "Fruit Ninja": "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1118100/header.jpg",
                "Celeste": "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/504230/header.jpg",
                "Hollow Knight": "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/367520/header.jpg",
                "Cuphead": "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/268910/header.jpg"
            };
            
            for (let [key, url] of Object.entries(gameImages)) {
                if (gameName.toLowerCase().includes(key.toLowerCase())) {
                    return url;
                }
            }
            return null;
        }

        function isSupportedGame(gameName) {
            return SUPPORTED_GAMES.some(sg => gameName.toLowerCase().includes(sg.toLowerCase()));
        }

        function getGameFile(gameName) {
            for (let [key, file] of Object.entries(GAME_FILES)) {
                if (gameName.toLowerCase().includes(key.toLowerCase())) {
                    return file;
                }
            }
            return null;
        }

        // ==================== RENDER CARRUSEL ====================
        function renderCarousel() {
            const track = document.getElementById('carouselTrack');
            track.innerHTML = '';
            cards = [];

            if (!userGames.length) {
                track.innerHTML = '<div class="loading"><div class="spinner"></div><p>Cargando juegos...</p></div>';
                return;
            }

            userGames.forEach((game, idx) => {
                const img = getGameImageUrl(game);
                const card = document.createElement('div');
                card.className = `game-card ${idx === currentIndex ? 'center' : ''}`;
                card.innerHTML = `
                    <div class="game-cover">
                        ${img ? `<img src="${img}" onerror="this.src='https://via.placeholder.com/200x266/1a1f3a/66c0f4?text=${encodeURIComponent(game)}'">` : 
                                 `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:40px;">🎮</div>`}
                    </div>
                    <div class="game-title-carousel">${game}</div>
                `;
                card.onclick = () => selectGame(idx);
                track.appendChild(card);
                cards.push(card);
            });
            
            updateSelectedInfo();
        }

        function selectGame(index) {
            if (index < 0) index = 0;
            if (index >= userGames.length) index = userGames.length - 1;
            currentIndex = index;
            
            cards.forEach((card, i) => {
                if (i === currentIndex) card.classList.add('center');
                else card.classList.remove('center');
            });
            
            updateSelectedInfo();
            cards[currentIndex]?.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
        }

        function updateSelectedInfo() {
            if (!userGames.length) return;
            const game = userGames[currentIndex];
            const supported = isSupportedGame(game);
            const playBtn = document.getElementById('playBtn');
            const stats = document.getElementById('gameStats');
            
            if (supported) {
                playBtn.classList.remove('disabled');
                playBtn.style.background = 'linear-gradient(135deg, #4caf50, #2e7d32)';
            } else {
                playBtn.classList.add('disabled');
                playBtn.style.background = '#555';
            }
            
            stats.innerHTML = `${supported ? '✅ Juego compatible con Steam Deck' : '❌ Juego no disponible en nuestra plataforma'}`;
        }

        // ==================== RENDER BIBLIOTECA ====================
        function renderLibrary() {
            const grid = document.getElementById('libraryGrid');
            grid.innerHTML = '';
            
            if (!userGames.length) {
                grid.innerHTML = '<div class="loading"><div class="spinner"></div><p>Cargando biblioteca...</p></div>';
                return;
            }
            
            userGames.forEach(game => {
                const supported = isSupportedGame(game);
                const img = getGameImageUrl(game);
                const card = document.createElement('div');
                card.className = `lib-card ${supported ? 'supported' : 'unsupported'}`;
                card.innerHTML = `
                    <div class="lib-img">
                        ${img ? `<img src="${img}" onerror="this.innerHTML='🎮'">` : '🎮'}
                    </div>
                    <div class="lib-info">
                        <div class="lib-title">${game}</div>
                        <div class="lib-status">${supported ? '✅ Disponible para jugar' : '❌ No soportado'}</div>
                    </div>
                `;
                card.onclick = () => showGameDetails(game);
                grid.appendChild(card);
            });
        }

        // ==================== DETALLES JUEGO ====================
        async function showGameDetails(gameName) {
            const supported = isSupportedGame(gameName);
            const img = getGameImageUrl(gameName);
            const modal = document.getElementById('detailModal');
            const content = document.getElementById('detailContent');
            
            // Obtener detalles de Steam
            const steamDetails = await getGameDetails(gameName);
            
            let detailsHtml = `
                ${img ? `<img src="${img}" onerror="this.src='https://via.placeholder.com/400x200/1a1f3a/66c0f4?text=${encodeURIComponent(gameName)}'">` : '<div style="font-size:60px;">🎮</div>'}
                <h2>${gameName}</h2>
            `;
            
            if (steamDetails) {
                detailsHtml += `
                    <div style="margin:15px 0; text-align:left;">
                        <p><strong>📝 ${steamDetails.short_description || steamDetails.about_the_game?.substring(0, 150) || "Sin descripción"}</strong></p>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:15px;">
                            <div>📅 ${steamDetails.release_date?.date || "Desconocido"}</div>
                            <div>⭐ ${steamDetails.metacritic?.score || "N/A"}/100</div>
                            <div>🎮 ${steamDetails.genres?.map(g => g.description).join(", ") || "N/A"}</div>
                            <div>💰 ${steamDetails.is_free ? "Gratis" : (steamDetails.price_overview?.final_formatted || "Consultar")}</div>
                        </div>
                    </div>
                `;
            } else {
                detailsHtml += `<p style="margin:15px 0;">${supported ? '✅ Juego compatible con Steam Deck' : '❌ Este juego no está disponible en nuestra plataforma'}</p>`;
            }
            
            detailsHtml += `
                <div style="display:flex; gap:10px; justify-content:center; margin-top:15px;">
                    ${supported ? `<button id="modalPlayBtn" style="background:#4caf50; border:none; padding:10px 25px; border-radius:25px; color:white; cursor:pointer;">▶ JUGAR</button>` : ''}
                    <button id="modalCloseBtn" style="background:#555; border:none; padding:10px 25px; border-radius:25px; color:white; cursor:pointer;">CERRAR</button>
                </div>
            `;
            
            content.innerHTML = detailsHtml;
            modal.classList.add('active');
            
            if (supported) {
                document.getElementById('modalPlayBtn')?.addEventListener('click', () => {
                    modal.classList.remove('active');
                    launchGame(gameName);
                });
            }
            document.getElementById('modalCloseBtn')?.addEventListener('click', () => modal.classList.remove('active'));
        }

        // ==================== LANZAR JUEGO ====================
        function launchGame(gameName) {
            const file = getGameFile(gameName);
            if (!file) {
                alert(`No se encontró el archivo para: ${gameName}\nVerifica que existe en la carpeta /games/`);
                return;
            }
            
            const fullscreen = document.getElementById('fullscreen');
            const frame = document.getElementById('gameFrame');
            frame.src = `./games/${file}`;
            fullscreen.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeGame() {
            const fullscreen = document.getElementById('fullscreen');
            const frame = document.getElementById('gameFrame');
            frame.src = 'about:blank';
            fullscreen.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // ==================== LOGIN CON STEAM ====================
        async function loginWithSteamId(steamId) {
            if (!steamId || steamId.length < 10) {
                alert("Por favor ingresa un Steam ID válido (17 dígitos)");
                return false;
            }
            
            document.getElementById('loginModal').classList.remove('active');
            
            // Mostrar loading
            document.getElementById('homeView').innerHTML = '<div class="loading"><div class="spinner"></div><p>Conectando con Steam y cargando tu biblioteca...</p></div>';
            
            try {
                // Obtener biblioteca real del usuario
                userGames = await getSteamUserGames(steamId);
                currentSteamId = steamId;
                currentUser = `Steam_${steamId.slice(-6)}`;
                
                document.getElementById('userName').innerHTML = currentUser;
                document.getElementById('menuUserName').innerHTML = currentUser;
                
                // Recargar la UI
                location.reload(); // Recargar para resetear vistas
                
                // Guardar en localStorage
                localStorage.setItem('steam_id', steamId);
                localStorage.setItem('steam_user', currentUser);
                
                return true;
            } catch (error) {
                console.error("Error:", error);
                alert("Error al conectar con Steam. Verifica tu Steam ID.");
                document.getElementById('loginModal').classList.add('active');
                return false;
            }
        }

        // ==================== QR LOGIN ====================
        function showQRLogin() {
            const qrArea = document.getElementById('qrArea');
            qrArea.style.display = 'block';
            qrArea.innerHTML = '<div id="qrCode"></div><p style="margin-top:15px; color:#000;">Escanea con Steam Mobile</p>';
            
            // Generar URL de login de Steam (formato real)
            const timestamp = Date.now();
            const loginUrl = `steam://open/login/${Math.random().toString(36).substring(2, 15)}`;
            
            new QRCode(document.getElementById("qrCode"), {
                text: loginUrl,
                width: 200,
                height: 200
            });
            
            // Simular detección de escaneo (en realidad redirigiría)
            let intentos = 0;
            const checkInterval = setInterval(() => {
                intentos++;
                if (intentos >= 10) {
                    clearInterval(checkInterval);
                    // Simular login exitoso después de escanear
                    const demoSteamId = "76561197960435530";
                    document.getElementById('steamIdInput').value = demoSteamId;
                    qrArea.style.display = 'none';
                    loginWithSteamId(demoSteamId);
                }
            }, 1000);
        }

        // ==================== CAMBIAR VISTA ====================
        function switchView(viewName) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            if (viewName === 'home') {
                document.getElementById('homeView').classList.add('active');
                renderCarousel();
            } else if (viewName === 'library') {
                document.getElementById('libraryView').classList.add('active');
                renderLibrary();
            }
            document.getElementById('steamMenu').classList.remove('open');
        }

        // ==================== TECLADO ====================
        function setupKeyboard() {
            document.addEventListener('keydown', (e) => {
                if (document.getElementById('fullscreen').classList.contains('active')) {
                    if (e.key === 'Escape') {
                        e.preventDefault();
                        closeGame();
                    }
                    return;
                }
                
                if (document.getElementById('detailModal').classList.contains('active')) {
                    if (e.key === 'Escape') {
                        document.getElementById('detailModal').classList.remove('active');
                    }
                    return;
                }
                
                if (document.getElementById('steamMenu').classList.contains('open')) {
                    if (e.key === 'Escape') {
                        document.getElementById('steamMenu').classList.remove('open');
                    }
                    return;
                }
                
                const activeView = document.querySelector('.view.active')?.id;
                
                if (activeView === 'homeView' && userGames.length) {
                    if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        selectGame(currentIndex + 1);
                    } else if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        selectGame(currentIndex - 1);
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        const game = userGames[currentIndex];
                        if (isSupportedGame(game)) launchGame(game);
                        else showGameDetails(game);
                    }
                }
                
                if (e.key === 's' || e.key === 'S') {
                    e.preventDefault();
                    document.getElementById('steamMenu').classList.toggle('open');
                }
            });
        }

        // ==================== RELOJ ====================
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerHTML = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
        }

        // ==================== INICIALIZACIÓN ====================
        document.getElementById('userBtn').onclick = () => document.getElementById('loginModal').classList.add('active');
        document.getElementById('menuBtn').onclick = () => document.getElementById('steamMenu').classList.toggle('open');
        document.getElementById('playBtn').onclick = () => { if (userGames.length && isSupportedGame(userGames[currentIndex])) launchGame(userGames[currentIndex]); };
        document.getElementById('detailBtn').onclick = () => { if (userGames.length) showGameDetails(userGames[currentIndex]); };
        document.getElementById('closeFullscreen').onclick = closeGame;
        document.getElementById('logoutBtn').onclick = () => {
            localStorage.removeItem('steam_id');
            localStorage.removeItem('steam_user');
            location.reload();
        };
        document.getElementById('loginWithIdBtn').onclick = () => {
            const steamId = document.getElementById('steamIdInput').value.trim();
            loginWithSteamId(steamId);
        };
        document.getElementById('qrLoginBtn').onclick = showQRLogin;
        document.getElementById('helpIdLink').onclick = (e) => {
            e.preventDefault();
            alert("Cómo obtener tu Steam ID:\n1. Abre tu perfil de Steam\n2. La URL será: https://steamcommunity.com/id/TU_USUARIO/\n3. Usa una web como steamid.io para convertir tu usuario a ID numérico\n\nID de ejemplo: 76561197960435530");
        };
        
        document.querySelectorAll('[data-view]').forEach(el => {
            el.onclick = () => switchView(el.getAttribute('data-view'));
        });
        
        updateClock();
        setInterval(updateClock, 60000);
        setupKeyboard();
        
        // Verificar login previo
        const savedId = localStorage.getItem('steam_id');
        if (savedId) {
            currentSteamId = savedId;
            currentUser = localStorage.getItem('steam_user');
            document.getElementById('userName').innerHTML = currentUser;
            document.getElementById('menuUserName').innerHTML = currentUser;
            
            // Cargar juegos
            getSteamUserGames(savedId).then(games => {
                userGames = games;
                renderCarousel();
            });
        } else {
            // Mostrar login automáticamente
            setTimeout(() => {
                if (!currentUser) {
                    document.getElementById('loginModal').classList.add('active');
                }
            }, 500);
        }
        
        console.log('✅ Steam Deck Client - Versión con login real y QR');
        console.log('🎮 Controles: ← → navegar | ENTER jugar | S menú | ESC cerrar');
    </script>
</body>
</html>
