// ========== DETECCIÓN AUTOMÁTICA DE IDIOMA ==========
function detectBrowserLanguage() {
    const browserLang = navigator.language || navigator.userLanguage;
    if (!browserLang) return 'en';
    const langCode = browserLang.split('-')[0].toLowerCase();
    const supportedLangs = ['es', 'en', 'de', 'fr', 'pt', 'it', 'ru', 'zh', 'ja'];
    if (langCode === 'zh') return 'zh';
    if (langCode === 'ja') return 'ja';
    if (langCode === 'ru') return 'ru';
    return supportedLangs.includes(langCode) ? langCode : 'en';
}

function initLanguage() {
    const savedLang = localStorage.getItem('winebox_language');
    const detectedLang = detectBrowserLanguage();
    if (savedLang && translations[savedLang]) {
        currentLanguage = savedLang;
    } else if (detectedLang && translations[detectedLang]) {
        currentLanguage = detectedLang;
        localStorage.setItem('winebox_language', currentLanguage);
    } else {
        currentLanguage = 'en';
    }
}

let currentLanguage = 'en';
initLanguage();

function t(k){ 
    return translations[currentLanguage]?.[k] || translations.en[k] || k; 
}

function applyTranslations(){ 
    document.querySelectorAll('[data-i18n]').forEach(el=>{ 
        if(el.tagName==='INPUT' && el.hasAttribute('data-i18n-placeholder')) 
            el.placeholder = t(el.getAttribute('data-i18n')); 
        else 
            el.textContent = t(el.getAttribute('data-i18n')); 
    }); 
    document.querySelectorAll('.category-button').forEach(btn => {
        const cat = btn.dataset.category;
        if (cat && translations[currentLanguage][`cat_${cat}`]) {
            btn.textContent = translations[currentLanguage][`cat_${cat}`];
        }

function showCustomAlert(message, icon = "⚠️") {
    return new Promise((resolve) => {
        const alertDiv = document.getElementById('customAlert');
        const messageSpan = document.getElementById('alertMessage');
        const iconSpan = document.getElementById('alertIcon');
        const okBtn = document.getElementById('alertOkBtn');
        
        messageSpan.textContent = message;
        iconSpan.textContent = icon;
        alertDiv.style.display = 'block';
        okBtn.focus();
        
        const closeAlert = () => {
            alertDiv.style.display = 'none';
            document.removeEventListener('keydown', handleKeyPress);
            resolve();
        };
        
        const handleKeyPress = (e) => {
            if (e.key === 'Enter' || e.key === 'Escape') {
                e.preventDefault();
                closeAlert();
            }
        };
        
        okBtn.onclick = closeAlert;
        document.addEventListener('keydown', handleKeyPress);
    });
}

// ========== PROGRAM MANAGER ==========
function isAppInstalled(appName){ 
    let data=JSON.parse(localStorage.getItem('programManagerData')); 
    return data?data.shortcuts.some(s=>s.name===appName&&s.type==='web'):false; 
}

function getInstalledApps(){ 
    let data=JSON.parse(localStorage.getItem('programManagerData')); 
    if(!data) return []; 
    return data.shortcuts.filter(s=>s.type==='web'&&!s.isDiscoLocal&&!s.isTrash).map(s=>{ 
        let original=appDataGlobal.find(a=>a.name===s.name); 
        return original||{name:s.name,image:s.icon,category:'installed',description:'Installed app',link:s.url}; 
    }); 
}

function installApp(app){ 
    let pmData=JSON.parse(localStorage.getItem('programManagerData'))||{shortcuts:[],folders:[],trash:[]}; 
    if(pmData.shortcuts.some(s=>s.name===app.name)){ 
        showStatusMessage(`${app.name} already installed`,'warning'); 
        return; 
    } 
    pmData.shortcuts.push({id:Date.now().toString(),name:app.name,icon:app.image,type:'web',url:app.link}); 
    localStorage.setItem('programManagerData',JSON.stringify(pmData)); 
    showStatusMessage(`${app.name} installed`); 
    setTimeout(()=>location.reload(),800); 
}

function uninstallApp(app){ 
    let data=JSON.parse(localStorage.getItem('programManagerData')); 
    if(data){ 
        data.shortcuts=data.shortcuts.filter(s=>!(s.name===app.name&&s.type==='web')); 
        localStorage.setItem('programManagerData',JSON.stringify(data)); 
        showStatusMessage(`${app.name} uninstalled`); 
        setTimeout(()=>location.reload(),800); 
    } 
}

// ========== ALGORITMO NEUROSCREENING ==========
function getGameArchetype(game){
    if(!game) return "mixto";
    let cat=game.category||'';
    if(cat==='rts'||cat==='strategy') return "introspectivo";
    if(cat==='arcade'||cat==='action') return "impulsivo";
    return "mixto";
}

function calcularPerfil(){
    if(usageLog.length<2) return null;
    let impulsividad=50, atencion=50, planificacion=50, emocional=50;
    let introCount=0, impCount=0, mixCount=0;
    let frecuencias=new Map();
    let tiempoTotal=0;
    usageLog.forEach(log=>{ 
        frecuencias.set(log.name,(frecuencias.get(log.name)||0)+1); 
        tiempoTotal+=log.duration; 
        if(log.duration<8) impulsividad+=12; 
        else if(log.duration>180) atencion+=10; 
        if(log.duration>300) planificacion+=8; 
    });
    for(let [name,count] of frecuencias.entries()){
        let game=appDataGlobal.find(g=>g.name===name);
        let tipo=getGameArchetype(game);
        if(tipo==="introspectivo") introCount+=count;
        else if(tipo==="impulsivo") impCount+=count;
        else mixCount+=count;
        if(count>=3) impulsividad+=10;
        if(count>=5) emocional+=8;
    }
    impulsividad=Math.min(100,impulsividad+(impCount>introCount?20:0)+(mixCount>0?5:0));
    atencion=Math.min(100,atencion+15+(tiempoTotal>600?12:0));
    planificacion=Math.min(100,planificacion+(introCount>impCount?24:14)+(mixCount>0?8:0));
    emocional=Math.min(100,emocional+(tiempoTotal>300?14:0));
    let patron="";
    if(impCount>introCount && impulsividad>65) patron = t('neuro_impulsive_profile');
    else if(introCount>impCount && planificacion>65) patron = t('neuro_introspective_profile');
    else if(impulsividad>70) patron = t('neuro_high_reactivity');
    else if(planificacion>70) patron = t('neuro_strategic_profile');
    else patron = t('neuro_balanced_profile');
    return { impulsividad, atencion, planificacion, emocional, patron, sesiones:usageLog.length, tiempoTotal, introCount, impCount, mixCount };
}

function generarEvaluacion(){

    grid.innerHTML='';
    if(apps.length === 0) {
        let emptyMsg = document.createElement('p');
        emptyMsg.textContent = t('no_apps');
        emptyMsg.style.color = '#666';
        emptyMsg.style.padding = '40px';
        emptyMsg.style.textAlign = 'center';
        grid.appendChild(emptyMsg);
        return;
    }
    apps.forEach((app,idx)=>{ 
        let card=document.createElement('div'); 
        card.className='app-card'; 
        card.setAttribute('data-index',idx);
        card.setAttribute('tabindex','0');
        card.innerHTML=`<img src="${app.image}" class="app-thumbnail" onerror="this.src='https://placehold.co/240x200/333/666?text=No+Image'"><div class="app-info"><div class="app-title">${app.name}</div><div class="app-category">${app.category}</div></div>`; 
        card.onclick=(e)=>{ e.stopPropagation(); openAppModal(app); };
        card.onkeydown=(e)=>{ if(e.key==='Enter'){ e.preventDefault(); openAppModal(app); } };
        grid.appendChild(card); 
    });
    if(currentFocusArea==='apps' && currentSelectedIndex>=currentApps.length) currentSelectedIndex=currentApps.length-1;
    if(currentSelectedIndex<0 && currentApps.length) currentSelectedIndex=0;
    updateSelection();
}

function displayRecentApps(){
    let cont=document.getElementById('recentApps'); 
    cont.innerHTML='';
    if(recentApps.length===0){ 
        let p=document.createElement('p'); 
        p.textContent=t('no_recent'); 
        p.style.color='#666'; 
        p.style.padding='10px'; 
        cont.appendChild(p); 
        return; 
    }
    recentApps.slice(0,16).forEach((app,i)=>{ 
        let img=document.createElement('img'); 
        img.src=app.image||'https://placehold.co/160x160/333/666?text=App'; 
        img.className='recent-app'; 
        img.setAttribute('data-index',i); 
        img.setAttribute('data-name',app.name); 
        img.setAttribute('tabindex','0');
        img.onerror=function(){ this.src='https://placehold.co/160x160/333/666?text=App'; }; 
        img.onclick=()=>openAppModal(app); 
        img.onkeydown=(e)=>{ if(e.key==='Enter'){ e.preventDefault(); openAppModal(app); } };
        cont.appendChild(img); 
    });
    if(currentFocusArea==='recent' && recentApps.length){ 
        currentRecentIndex=Math.min(currentRecentIndex, recentApps.length-1);
        if(currentRecentIndex<0) currentRecentIndex=0;
        updateSelection(); 
    }
}

function updateSelection(){
    document.querySelectorAll('.recent-app').forEach((el,i)=>{ 
        if(i===currentRecentIndex && currentFocusArea==='recent'){ 
            el.classList.add('selected'); 
            let name=el.getAttribute('data-name'); 
            if(name) document.getElementById('selectedAppInfo').textContent=name; 
            el.scrollIntoView({behavior:'smooth',block:'nearest'});
            el.focus();
        } else { 
            el.classList.remove('selected'); 
        } 
    });
    if(categoryButtons.length){
        categoryButtons.forEach((btn,i)=>{ 
            if(i===currentCategoryIndex && currentFocusArea==='categories') btn.classList.add('selected'); 
            else btn.classList.remove('selected'); 
        });
        if(currentFocusArea==='categories' && categoryButtons[currentCategoryIndex]) {
            categoryButtons[currentCategoryIndex].focus();
        }
    }
    document.querySelectorAll('.app-card').forEach((card,i)=>{ 
        if(i===currentSelectedIndex && currentFocusArea==='apps'){ 
            card.classList.add('selected'); 
            card.scrollIntoView({behavior:'smooth',block:'nearest'});
            card.focus();
        } else { 
            card.classList.remove('selected'); 
        } 
    });
    document.querySelectorAll('.menu-item').forEach((item,i)=>{ 
        if(i===currentMenuItemIndex && currentFocusArea==='menu') item.classList.add('selected'); 
        else item.classList.remove('selected'); 
    });
    if(currentFocusArea === 'header' && currentHeaderIndex >= 0) {
        headerButtons.forEach((btnId, idx) => {
            let btn = document.getElementById(btnId);
            if(btn) {
                if(idx === currentHeaderIndex) {
                    btn.style.outline = '2px solid #4a6fa5';
                    btn.style.outlineOffset = '2px';
                    btn.focus();
                } else {
                    btn.style.outline = 'none';
                }
            }
        });
    } else {
        headerButtons.forEach(btnId => {
            let btn = document.getElementById(btnId);
            if(btn) btn.style.outline = 'none';
        });
    }
}

function handleModalKeydown(e){
    if(!isModalOpen) return;
    const btns = modalButtons.filter(b => b.style.display !== 'none');
    if(e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        if(e.key === 'ArrowRight') currentModalFocusIndex = (currentModalFocusIndex + 1) % btns.length;
        else currentModalFocusIndex = (currentModalFocusIndex - 1 + btns.length) % btns.length;
        btns.forEach((btn, i) => {
            if(i === currentModalFocusIndex) btn.focus();
        });
    } else if(e.key === 'Escape') {
        e.preventDefault();
        closeModal();
    } else if(e.key === 'Enter' && btns[currentModalFocusIndex]) {
        e.preventDefault();
        btns[currentModalFocusIndex].click();
    }
}

function getGridCols(){
    let grid = document.getElementById('appGrid');
    if(!grid) return 3;
    let cardWidth = 260;
    let cols = Math.floor(grid.clientWidth / cardWidth);
    return Math.max(1, cols);
}

function handleKeyDown(e){
    if(isModalOpen){ handleModalKeydown(e); return; }
    if(document.getElementById('confirmModal').style.display==='block') return;
    if(document.getElementById('virtualWindow').style.display==='flex'){ 
        if(e.key==='Escape'){ 
            cerrarVentanaVirtual();
        } 
        return; 
    }
    if(e.key === 'F2') {
        e.preventDefault();
        currentFocusArea = 'header';
        currentHeaderIndex = 0;
        updateSelection();
        return;
    }
    if(e.key === 'Tab') {
        e.preventDefault();
        if(currentFocusArea === 'header') {
            currentFocusArea = 'recent';
            currentHeaderIndex = -1;
            if(recentApps.length) currentRecentIndex = 0;
        } else if(currentFocusArea === 'recent') {
            currentFocusArea = 'categories';
            currentCategoryIndex = 0;
        } else if(currentFocusArea === 'categories') {
            if(currentApps.length) {
                currentFocusArea = 'apps';
                currentSelectedIndex = 0;
            } else {
                currentFocusArea = 'header';
                currentHeaderIndex = 0;
            }
        } else if(currentFocusArea === 'apps') {
            currentFocusArea = 'header';
            currentHeaderIndex = 0;
        }
        updateSelection();
        return;
    }
    switch(e.key){
        case 'ArrowUp': 
            e.preventDefault(); 
            if(currentFocusArea === 'header') {
                if(currentHeaderIndex > 0) { currentHeaderIndex--; updateSelection(); } 
                else if(currentHeaderIndex === 0) { currentFocusArea = 'recent'; currentHeaderIndex = -1; if(recentApps.length) currentRecentIndex = 0; updateSelection(); }
            } else if(isMenuOpen && currentMenuItemIndex>0){ currentMenuItemIndex--; updateSelection(); } 
            else if(currentFocusArea==='apps' && currentSelectedIndex>=getGridCols()){ currentSelectedIndex -= getGridCols(); updateSelection(); } 
            else if(currentFocusArea==='apps' && currentSelectedIndex>=0 && currentSelectedIndex<getGridCols()){ currentFocusArea='categories'; currentCategoryIndex = Math.min(currentCategoryIndex, categoryButtons.length-1); updateSelection(); } 
            else if(currentFocusArea==='categories' && currentCategoryIndex>0){ currentCategoryIndex--; updateSelection(); } 
            else if(currentFocusArea==='categories' && currentCategoryIndex===0){ currentFocusArea='recent'; if(recentApps.length) currentRecentIndex=Math.min(currentRecentIndex, recentApps.length-1); if(currentRecentIndex<0 && recentApps.length) currentRecentIndex=0; updateSelection(); } 
            break;
        case 'ArrowDown': 
            e.preventDefault(); 
            if(currentFocusArea === 'header') {
                if(currentHeaderIndex < headerButtons.length - 1) { currentHeaderIndex++; updateSelection(); }
            } else if(isMenuOpen && currentMenuItemIndex<document.querySelectorAll('.menu-item').length-1){ currentMenuItemIndex++; updateSelection(); } 
            else if(currentFocusArea==='recent'){ currentFocusArea='categories'; currentCategoryIndex=0; updateSelection(); } 
            else if(currentFocusArea==='categories' && categoryButtons.length){ currentFocusArea='apps'; currentSelectedIndex = currentApps.length?0:-1; updateSelection(); } 
            else if(currentFocusArea==='apps' && currentSelectedIndex+getGridCols() < currentApps.length){ currentSelectedIndex += getGridCols(); updateSelection(); } 
            break;
        case 'ArrowLeft': 
            e.preventDefault(); 
            if(currentFocusArea === 'header') {
                if(currentHeaderIndex > 0) { currentHeaderIndex--; updateSelection(); } 
                else if(currentHeaderIndex === 0) { currentFocusArea = 'recent'; if(recentApps.length) currentRecentIndex = 0; currentHeaderIndex = -1; updateSelection(); }
            } else if(currentFocusArea==='recent' && currentRecentIndex>0){ currentRecentIndex--; updateSelection(); } 
            else if(currentFocusArea==='categories' && currentCategoryIndex>0){ currentCategoryIndex--; updateSelection(); } 
            else if(currentFocusArea==='apps' && currentSelectedIndex>0){ currentSelectedIndex--; updateSelection(); } 
            break;
        case 'ArrowRight': 
            e.preventDefault(); 
            if(currentFocusArea === 'header') {
                if(currentHeaderIndex < headerButtons.length - 1) { currentHeaderIndex++; updateSelection(); }
            } else if(currentFocusArea==='recent' && currentRecentIndex<recentApps.length-1){ currentRecentIndex++; updateSelection(); } 
            else if(currentFocusArea==='categories' && currentCategoryIndex<categoryButtons.length-1){ currentCategoryIndex++; updateSelection(); } 
            else if(currentFocusArea==='apps' && currentSelectedIndex<currentApps.length-1){ currentSelectedIndex++; updateSelection(); } 
            break;
        case 'Enter': 
            e.preventDefault(); 
            if(currentFocusArea === 'header' && currentHeaderIndex >= 0) {
                let btnId = headerButtons[currentHeaderIndex];
                let btn = document.getElementById(btnId);
                if(btnId === 'searchInput') { btn.focus(); } 
                else if(btn) { btn.click(); }
            } else if(isMenuOpen && currentMenuItemIndex>=0){ document.querySelectorAll('.menu-item')[currentMenuItemIndex]?.click(); } 
            else if(currentFocusArea==='recent' && currentRecentIndex>=0 && recentApps[currentRecentIndex]){ openAppModal(recentApps[currentRecentIndex]); } 
            else if(currentFocusArea==='categories' && categoryButtons[currentCategoryIndex]){ categoryButtons[currentCategoryIndex].click(); currentFocusArea='apps'; currentSelectedIndex=0; updateSelection(); } 
            else if(currentFocusArea==='apps' && currentSelectedIndex>=0 && currentApps[currentSelectedIndex]){ openAppModal(currentApps[currentSelectedIndex]); } 
            break;
        case 'Escape': 
            if(isMenuOpen){ 
                document.getElementById('sideMenu').classList.remove('open'); 
                document.getElementById('menuOverlay').classList.remove('open'); 
                isMenuOpen=false; 
                currentFocusArea='recent'; 
                updateSelection(); 
            } else if(document.getElementById('searchInput').value.trim()){ 
                document.getElementById('searchInput').value=''; 
                document.querySelector('.search-button').click(); 
            } else if(currentFocusArea === 'header') { 
                currentFocusArea = 'recent'; 
                currentHeaderIndex = -1; 
                if(recentApps.length) currentRecentIndex=0; 
                updateSelection(); 
            }
            break;
    }
}

let currentModalApp = null;
let launchHandlerRef, installHandlerRef, uninstallHandlerRef;

function openAppModal(app){
    let modal=document.getElementById('appModal'); 
    isModalOpen=true;
    currentModalApp = app;
    let desc = app.description;
    if(typeof desc === 'object') desc = desc[currentLanguage] || desc.en || app.name;
    if(!desc) desc = app.name;
    document.getElementById('appDetails').innerHTML=`<h2>${app.name}</h2><img src="${app.image}" style="max-width:200px;border-radius:8px;" onerror="this.src='https://placehold.co/200x200/333/666?text=No+Image'"><p><strong>${t('cat_apps')}:</strong> ${app.category}</p><p>${desc}</p>`;
    let installed=isAppInstalled(app.name);
    const launchBtn = document.getElementById('launchButton');
    const installBtn = document.getElementById('installButton');
    const uninstallBtn = document.getElementById('uninstallButton');
    installBtn.style.display=installed?'none':'inline-block';
    uninstallBtn.style.display=installed?'inline-block':'none';
    modalButtons = [launchBtn, installBtn, uninstallBtn].filter(b => b.style.display !== 'none');
    currentModalFocusIndex = 0;
    
    if(launchHandlerRef) launchBtn.removeEventListener('click', launchHandlerRef);
    if(installHandlerRef) installBtn.removeEventListener('click', installHandlerRef);
    if(uninstallHandlerRef) uninstallBtn.removeEventListener('click', uninstallHandlerRef);
    
    launchHandlerRef = () => { 
        addToRecent(app); 
        startTracking(app); 
        let win=document.getElementById('virtualWindow'); 
        // RECREAR IFRAME LIMPIO para la app
        let iframe = recrearIframe();
        iframe.src = app.link;
        win.style.display='flex'; 
        document.body.style.overflow='hidden'; 
        
        if(currentTrackingInterval) clearInterval(currentTrackingInterval);
        
        currentTrackingInterval = setInterval(()=>{ 
            if(win.style.display !== 'flex'){ 
                stopTracking(); 
                clearInterval(currentTrackingInterval); 
                currentTrackingInterval = null;
            } 
        }, 500);
        
        // Configurar botón de cierre
        document.getElementById('closeVirtualWindowBtn').onclick = cerrarVentanaVirtual;
        
        modal.style.display='none'; 
        isModalOpen=false; 
    };
    
    installHandlerRef = () => { installApp(app); modal.style.display='none'; isModalOpen=false; };
    uninstallHandlerRef = () => { showConfirmModal(app); modal.style.display='none'; isModalOpen=false; };
    
    launchBtn.addEventListener('click', launchHandlerRef);
    installBtn.addEventListener('click', installHandlerRef);
    uninstallBtn.addEventListener('click', uninstallHandlerRef);
    
    modal.style.display='block';
    setTimeout(() => { if(modalButtons[0]) modalButtons[0].focus(); }, 100);
}

function addToRecent(app){ 
    recentApps=recentApps.filter(a=>a.name!==app.name); 
    recentApps.unshift(app); 
    if(recentApps.length>16) recentApps.pop(); 
    localStorage.setItem('recentApps',JSON.stringify(recentApps)); 
    displayRecentApps(); 
}

function closeModal(){ 
    document.getElementById('appModal').style.display='none'; 
    isModalOpen=false; 
    currentModalFocusIndex = -1;
    currentModalApp = null;
}

window.addEventListener('load',()=>{
    if(window.appData && window.appData.length){
        appDataGlobal=window.appData;
        let catsDiv=document.getElementById('categories');
        let cats=['all','apps','games','multimedia','utilities','arcade','rts'];
        catsDiv.innerHTML=cats.map(c=>`<button class="category-button" data-category="${c}" data-i18n="cat_${c}" tabindex="0">${c}</button>`).join('');
        categoryButtons=document.querySelectorAll('.category-button');
        displayApps(appDataGlobal);
        displayRecentApps();
        categoryButtons.forEach(btn=>btn.addEventListener('click',()=>{ 
            let cat=btn.dataset.category; 
            if(cat==='all') displayApps(appDataGlobal); 
            else if(cat==='uninstall') displayApps(getInstalledApps()); 
            else displayApps(appDataGlobal.filter(a=>a.category===cat)); 
            currentFocusArea='apps'; 
            currentSelectedIndex=0; 
            updateSelection(); 
        }));
        document.getElementById('searchBtn').addEventListener('click',()=>{ 
            let q=document.getElementById('searchInput').value.trim().toLowerCase(); 
            displayApps(q?appDataGlobal.filter(a=>a.name.toLowerCase().includes(q)):appDataGlobal); 
            currentFocusArea='apps'; 
            currentSelectedIndex=0; 
            updateSelection(); 
        });
        document.getElementById('searchInput').addEventListener('keypress',(e)=>{
            if(e.key==='Enter'){
                document.getElementById('searchBtn').click();
            }
        });
        document.getElementById('menuButton').addEventListener('click',()=>{ 
            document.getElementById('sideMenu').classList.toggle('open'); 
            document.getElementById('menuOverlay').classList.toggle('open'); 
            isMenuOpen=!isMenuOpen; 
            if(isMenuOpen){ 
                currentFocusArea='menu'; 
                currentMenuItemIndex=0; 
                updateSelection(); 
            } else { 
                currentFocusArea='recent'; 
                updateSelection(); 
            } 
        });
        document.getElementById('menuOverlay').addEventListener('click',()=>{ 
            document.getElementById('sideMenu').classList.remove('open'); 
            document.getElementById('menuOverlay').classList.remove('open'); 
            isMenuOpen=false; 
            currentFocusArea='recent'; 
            updateSelection(); 
        });
        document.querySelectorAll('.menu-item').forEach(el=>el.addEventListener('click',()=>{ 
            let cat=el.dataset.category; 
            if(cat==='all') displayApps(appDataGlobal); 
            else if(cat==='uninstall') displayApps(getInstalledApps()); 
            else displayApps(appDataGlobal.filter(a=>a.category===cat)); 
            document.getElementById('sideMenu').classList.remove('open'); 
            document.getElementById('menuOverlay').classList.remove('open'); 
            isMenuOpen=false; 
            currentFocusArea='apps'; 
            currentSelectedIndex=0; 
            updateSelection(); 
        }));
        const closeBtn = document.querySelector('.close');
        if(closeBtn) closeBtn.addEventListener('click',closeModal);
        window.onclick=function(e){ 
            if(e.target==document.getElementById('appModal')) closeModal(); 
            if(e.target==document.getElementById('confirmModal')) closeConfirmModal(); 
            if(e.target==document.getElementById('customAlert')) document.getElementById('customAlert').style.display='none'; 
        };
        document.getElementById('scrollIndicator').addEventListener('click',()=>{ document.querySelector('.recent-apps').scrollBy({left:200,behavior:'smooth'}); });
        document.addEventListener('keydown',handleKeyDown);
        applyTranslations();
        
        // Inicializar variables globales
        currentTrackingInterval = null;
    } else { 
        setTimeout(()=>window.location.reload(),200); 
    }
});

document.getElementById('openScreeningBtn').addEventListener('click',abrirScreening);
document.getElementById('langToggle').addEventListener('click',(e)=>{ e.stopPropagation(); document.getElementById('langMenu').classList.toggle('show'); });
document.querySelectorAll('.lang-option').forEach(opt=>opt.addEventListener('click',()=>{ setLanguage(opt.dataset.lang); document.getElementById('langMenu').classList.remove('show'); }));

document.addEventListener('click', function(e) {
    let langMenu = document.getElementById('langMenu');
    let langToggle = document.getElementById('langToggle');
    if(langMenu && langToggle && !langToggle.contains(e.target) && !langMenu.contains(e.target)) {
        langMenu.classList.remove('show');
    }
});

setLanguage(currentLanguage);

window.generarEvaluacion=generarEvaluacion;
window.mostrarScreeningEnVentana=mostrarScreeningEnVentana;
window.descargarInforme=descargarInforme;
window.abrirScreening=abrirScreening;
window.showCustomAlert=showCustomAlert;
window.cerrarVentanaVirtual=cerrarVentanaVirtual;
</script>
